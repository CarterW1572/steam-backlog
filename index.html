<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Game Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Color system: one hue (purple, 265°) in three steps, plus one accent from
     the opposite side of the color wheel. Neutrals are grays.
       shade  surfaces: cards, panels, the search box
       base   things you can act on: hover and focus rings, checkboxes, cover art
       tint   secondary links and highlights on top of purple
       accent where the eye goes first: the Search button, the home page's
              section headings, and each page's title                        */
  :root {
    --shade:  hsl(265 40% 17%);
    --base:   hsl(265 70% 58%);
    --tint:   hsl(265 90% 84%);
    --accent: hsl(45 100% 55%);
    --bg:     #0e0e11;
    --line:   #2c2c33;
    --text:   #f2f2f2;
    --soft:   hsl(265 15% 80%); /* a softer, slightly purple white for large home-page headings */
    --muted:  #a3a3ab;
    --on-accent: #17130a;
    /* Depth: boxes look lit from above, with a faint purple edge that's brighter along
       the top, and cast a soft shadow onto the page. Hovering a card deepens it. */
    --edge:       hsl(265 30% 30%);
    --edge-top:   hsl(265 40% 42%);
    --lift:       0 10px 28px rgb(0 0 0 / 0.7), 0 2px 6px rgb(0 0 0 / 0.6);
    --lift-hover: 0 18px 40px rgb(0 0 0 / 0.75), 0 4px 10px rgb(0 0 0 / 0.6);
    /* The same for controls (search, sort, buttons), scaled down to their size. */
    --lift-sm:       0 4px 12px rgb(0 0 0 / 0.6), 0 1px 3px rgb(0 0 0 / 0.5);
    --lift-sm-hover: 0 8px 20px rgb(0 0 0 / 0.7), 0 2px 5px rgb(0 0 0 / 0.55);
    --shine:      inset 0 1px 0 rgb(255 255 255 / 0.35); /* light top edge on a filled button */
    --radius: 16px;
    --gutter: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  /* Browsing pages (home, categories, search results; not game pages): a soft band of purple
     light across the page that fades in below the header, peaks behind the page's heading
     and fades out before the cards, so it has no edge to meet the header (whose bottom rule
     is dropped here too). On the page background, so it spans the window without making it
     scroll sideways. */
  body.browsing { background-image: linear-gradient(transparent 40px, hsl(265 70% 45% / 0.16) 160px, transparent 400px);
    background-repeat: no-repeat; }
  body.browsing .site-header { border-bottom-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }

  /* One column grid: header, breadcrumbs and page share the same left and right edges. */
  .container { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }

  /* Header */
  .site-header { position: sticky; top: 0; z-index: 20; background: rgb(14 14 17 / 0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); }
  .header-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding-top: 14px; padding-bottom: 14px; }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .logo-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--base);
    font-size: 13px; font-weight: 800; letter-spacing: 0.02em; }

  /* Search box with suggestions under it */
  .search { position: relative; display: flex; gap: 8px; flex: 1 1 320px; max-width: 520px; margin-left: auto; }
  .search input { flex: 1; width: 0; min-width: 0; height: 44px; padding: 0 20px; border-radius: 999px;
    border: 1px solid var(--edge); border-top-color: var(--edge-top); background: var(--shade); box-shadow: var(--lift-sm); }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--base); }
  #search-go { height: 44px; padding: 0 22px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700;
    box-shadow: var(--shine), var(--lift-sm); transition: filter 0.15s, box-shadow 0.15s, transform 0.15s; }
  #search-go:hover { filter: brightness(1.08); box-shadow: var(--shine), var(--lift-sm-hover); transform: translateY(-1px); }
  .search ul { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 5; list-style: none; padding: 8px;
    border: 1px solid var(--edge); border-top-color: var(--edge-top); border-radius: var(--radius); background: var(--shade);
    box-shadow: var(--lift-hover); }
  .search li { padding: 10px 14px; border-radius: 10px; cursor: pointer; }
  .search li:hover, .search li[aria-selected="true"] { background: var(--base); }
  .search li.see-all { color: var(--tint); font-weight: 500; }
  .search li.see-all:hover, .search li.see-all[aria-selected="true"] { color: var(--text); }

  /* Breadcrumbs */
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; padding-top: 20px; font-size: 14px; color: var(--muted); }
  .crumbs button { color: var(--tint); }
  .crumbs button:hover { text-decoration: underline; }
  .crumbs .sep { margin: 0 8px; }
  .crumbs .current { color: var(--text); }
  .crumbs.empty-crumbs { display: none; }

  /* Type scale: hero 40, page title 36, section 22, card 18/16, body 16, meta 14/13, label 12 */
  #main { padding-top: 28px; padding-bottom: 72px; }
  .hero { margin-bottom: 48px; }
  .hero-title { font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: var(--soft); }
  .page-head { margin-bottom: 32px; }
  .eyebrow { margin-bottom: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .page-title { font-size: 36px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: var(--accent); }
  .page-sub { margin-top: 8px; font-size: 16px; color: var(--muted); }
  .section-title { margin-bottom: 16px; font-size: 22px; font-weight: 700; color: var(--accent); }
  .browse + .browse { margin-top: 48px; }
  .notice { margin: -16px 0 24px; color: var(--muted); }

  /* Cards: every card is the same rounded shape on the same dark purple ground. */
  .card { display: flex; flex-direction: column; width: 100%; border: 1px solid var(--edge); border-top-color: var(--edge-top);
    border-radius: var(--radius); background: var(--shade); box-shadow: var(--lift);
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; }
  .card:hover { border-color: var(--base); box-shadow: var(--lift-hover); transform: translateY(-2px); }
  .card-title { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .card-meta { font-size: 14px; color: var(--muted); }

  /* Four columns on the home page, so both views' cards line up in the same columns. */
  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .cat-card { position: relative; overflow: hidden; isolation: isolate; justify-content: space-between; gap: 24px;
    min-height: 136px; padding: 20px; }
  /* Each category card has its own hue (--hue, set on the card from GENRES and PLAY_STYLES)
     for its edge, in place of the shared purple; hovering brightens the edge. */
  .cat-card { border-color: hsl(var(--hue) 45% 32%); border-top-color: hsl(var(--hue) 60% 50%); }
  .cat-card:hover { border-color: hsl(var(--hue) 75% 60%); }
  /* The category name and game count sit right on the art. They stay readable over any
     cover thanks to the dark wash behind them (::after, deepest at the top, bottom and left,
     where the text is) and a soft shadow around the letters. */
  .cat-card .card-title, .cat-card .card-meta { color: #fff;
    text-shadow: 0 1px 2px rgb(0 0 0 / 0.9), 0 0 12px rgb(0 0 0 / 0.75); }
  .cat-card .card-title { font-size: 18px; font-weight: 700; }
  .cat-card .card-meta { font-weight: 500; }
  /* Category art: a tilted collage of covers from the category, slightly soft until the
     card is hovered or focused, then sharp. It's kept bright, since it's most of the home
     page's color. */
  .cat-art { position: absolute; inset: -20%; z-index: -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    transform: rotate(-8deg); filter: blur(2px) brightness(0.9);
    transition: filter 0.3s, transform 0.3s; }
  .cat-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; background: var(--base); }
  .cat-card::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(90deg, rgb(0 0 0 / 0.45), transparent 70%),
      linear-gradient(rgb(0 0 0 / 0.65), rgb(0 0 0 / 0.1) 50%, rgb(0 0 0 / 0.7)); }
  .cat-card:hover .cat-art, .cat-card:focus-visible .cat-art { filter: none; transform: rotate(-8deg) scale(1.05); }

  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; align-content: start; }
  .game-card { overflow: hidden; }
  .game-card .card-title { font-size: 16px; }
  .card-body { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px 18px; }
  .card-note { font-size: 13px; color: var(--muted); }
  /* What a card says about a game at a glance: where it plays, how many can play, and the price. */
  .card-facts { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
  .card-facts b { font-weight: 600; color: var(--text); }
  .card-price { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tag.type { border-color: var(--base); color: var(--text); }
  /* Cover art fills the box; the initials behind it show while it loads or if it fails. */
  .cover { position: relative; overflow: hidden; display: grid; place-items: center; aspect-ratio: 2 / 1;
    background: linear-gradient(150deg, var(--base) -60%, var(--shade) 75%);
    color: var(--tint); font-size: 28px; font-weight: 800; letter-spacing: 0.04em; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); }

  /* Category page: filters on the left, games on the right. */
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: start; }
  .panel { padding: 20px; border: 1px solid var(--edge); border-top-color: var(--edge-top); border-radius: var(--radius);
    background: var(--shade); box-shadow: var(--lift); }
  .panel-title { margin-bottom: 16px; font-size: 16px; font-weight: 700; }
  /* The panel stays in view while the games scroll; when it's taller than the window it
     scrolls on its own, with a thin purple scrollbar instead of the system one. */
  .filters { position: sticky; top: 96px; max-height: calc(100vh - 112px); overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--base) transparent; }
  .filters::-webkit-scrollbar { width: 6px; }
  .filters::-webkit-scrollbar-thumb { border-radius: 3px; background: var(--base); }
  .filters::-webkit-scrollbar-track { background: transparent; }
  legend .rule { font-weight: 500; letter-spacing: 0.02em; text-transform: none; }
  /* Applied filters above the games, joined by "or" within a group and "and" across. */
  .applied { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1 1 300px; padding-top: 8px; font-size: 14px; }
  .applied-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .applied-label { color: var(--muted); }
  .joiner { font-size: 13px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 12px; border: 1px solid var(--base);
    border-radius: 999px; font-size: 13px; font-weight: 500; }
  .chip span { font-size: 15px; line-height: 1; color: var(--tint); }
  .chip:hover { background: var(--base); }
  .chip:hover span { color: var(--text); }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; }
  .clear { font-size: 14px; color: var(--tint); }
  .clear:hover { text-decoration: underline; }
  /* Sort menu above a list of games: a button that drops down a list of orders. */
  .list-head { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; gap: 12px 24px; margin-bottom: 16px; }
  .sort-menu { position: relative; flex: none; width: 240px; max-width: 100%; }
  .sort-toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 44px; padding: 0 16px;
    border: 1px solid var(--edge); border-top-color: var(--edge-top); border-radius: 12px; background: var(--shade);
    font-size: 15px; font-weight: 600; box-shadow: var(--lift-sm); transition: border-color 0.15s, box-shadow 0.15s; }
  .sort-toggle:hover, .sort-toggle[aria-expanded="true"] { border-color: var(--base); box-shadow: var(--lift-sm-hover); }
  .sort-current { font-weight: 400; color: var(--muted); }
  .caret { transition: transform 0.15s; }
  .sort-toggle[aria-expanded="true"] .caret { transform: rotate(180deg); }
  .sort-list { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 10; list-style: none; overflow: hidden;
    border: 1px solid var(--edge); border-top-color: var(--edge-top); border-radius: 12px; background: var(--shade);
    box-shadow: var(--lift-hover); }
  .sort-list li + li { border-top: 1px solid var(--line); }
  .sort-list button { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; padding: 11px 16px; font-size: 15px; }
  .sort-list button:hover, .sort-list button:focus-visible { background: var(--base); outline: none; }
  .sort-list button[aria-current] { color: var(--accent); font-weight: 600; }
  .sort-list button[aria-current]:hover, .sort-list button[aria-current]:focus-visible { color: var(--text); }
  .sort-list .hint { font-size: 13px; font-weight: 400; color: var(--muted); }
  .sort-list button:hover .hint, .sort-list button:focus-visible .hint { color: var(--text); }
  fieldset { border: none; }
  fieldset + fieldset { margin-top: 20px; }
  legend { width: 100%; margin-bottom: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  /* Each group's heading is a button that folds the group away; the caret points down when open. */
  .group-toggle { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 2px 0;
    letter-spacing: inherit; text-transform: inherit; }
  .group-toggle:hover { color: var(--text); }
  .group-toggle .caret { font-size: 14px; }
  .group-toggle[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .group-checked { color: var(--tint); }
  fieldset label { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 15px; cursor: pointer; }
  /* Checkboxes drawn in the theme: a dark box with a purple-gray outline (3:1 against the
     panel, so it still reads as a box), filled purple with a white tick when checked. The
     browser's own white boxes drew the eye away from the games. */
  fieldset input { flex: none; display: grid; place-items: center; width: 18px; height: 18px; margin: 0;
    appearance: none; border: 1.5px solid hsl(265 25% 55%); border-radius: 5px; background: var(--bg);
    cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  fieldset input::after { content: ""; width: 9px; height: 5px; margin-top: -2px; border: solid var(--text);
    border-width: 0 0 2px 2px; transform: rotate(-45deg); opacity: 0; }
  fieldset input:checked { border-color: var(--base); background: var(--base); }
  fieldset input:checked::after { opacity: 1; }
  fieldset label:not(.none):hover input { border-color: var(--tint); }
  fieldset .count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  fieldset label.none { opacity: 0.4; cursor: default; }
  fieldset label.none input { cursor: default; }
  .empty { padding: 40px 24px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; }

  /* Game page */
  /* Cover and About on the left; platforms and prices on the right, like a store's buy box. */
  .detail { display: grid; grid-template-columns: 3fr 2fr; gap: 24px; align-items: start; margin-bottom: 32px; }
  .detail-main, .detail-side { display: flex; flex-direction: column; gap: 24px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 15px; }
  .facts dt { color: var(--muted); }
  .facts dd { font-weight: 500; }
  .cover-large { border-radius: var(--radius); font-size: 64px; box-shadow: var(--lift); }
  .platforms { list-style: none; }
  .platforms li { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0;
    border-top: 1px solid var(--line); }
  .platforms li:first-child { border-top: 0; padding-top: 0; }
  .platform { display: flex; flex-direction: column; font-size: 15px; font-weight: 500; }
  .platform-note { font-size: 13px; font-weight: 400; color: var(--muted); }
  .price { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .price.unavailable { font-weight: 400; color: var(--muted); }
  .fine-print { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .description { max-width: 68ch; font-size: 16px; line-height: 1.6; }
  .sub-title { margin: 24px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .about .tag { font-size: 13px; padding: 4px 12px; color: var(--text); }
  .tag-link { transition: border-color 0.15s, background 0.15s; }
  .tag-link:hover { border-color: var(--base); background: var(--base); color: var(--text); }
  .via { margin-top: 24px; font-size: 14px; color: var(--muted); }
  .btn-secondary { padding: 10px 20px; border: 1px solid var(--base); border-top-color: hsl(265 80% 72%); border-radius: 999px;
    background: var(--shade); font-weight: 600; box-shadow: var(--lift-sm); transition: background 0.15s, box-shadow 0.15s, transform 0.15s; }
  .btn-secondary:hover { background: var(--base); box-shadow: var(--shine), var(--lift-sm-hover); transform: translateY(-1px); }

  /* Related games under a game page: rows of small cards that scroll sideways, four at a
     time, with round arrows over the ends. The tree test hides them (tree-test.js).     */
  .related { margin-top: 48px; }
  .related + .related { margin-top: 40px; }
  .no-related .related { display: none; }
  .related-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 12px; }
  .related-head .section-title { margin-bottom: 0; }
  .related-head .btn-secondary { flex: none; padding: 6px 16px; font-size: 14px; }
  .related-sub { margin-top: 2px; font-size: 14px; color: var(--muted); }
  .rail { position: relative; }
  /* A scrolling row clips whatever pokes out of it, so the track reaches past the cards on
     every side (padding, cancelled by a negative margin) to leave room for their shadows. */
  .rail { --bleed: var(--gutter); }
  .rail-track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 16px) / 4); gap: 16px;
    margin: -8px calc(-1 * var(--bleed)) -40px; padding: 8px var(--bleed) 40px; scroll-padding-inline: var(--bleed);
    overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .rail-track::-webkit-scrollbar { display: none; }
  .mini-card { overflow: hidden; scroll-snap-align: start; }
  .mini-body { display: flex; flex: 1; flex-direction: column; gap: 10px; padding: 12px 14px 14px; }
  .mini-card .card-title { font-size: 15px; }
  .mini-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; }
  .mini-foot .card-price { white-space: nowrap; }
  .rail-arrow { position: absolute; top: 50%; z-index: 2; display: grid; place-items: center; width: 44px; height: 44px;
    margin-top: -22px; border: 1px solid var(--line); border-radius: 999px; background: rgb(14 14 17 / 0.9);
    font-size: 26px; line-height: 1; box-shadow: 0 6px 20px rgb(0 0 0 / 0.5); transition: opacity 0.15s, background 0.15s; }
  .rail-arrow.prev { left: -20px; }
  .rail-arrow.next { right: -20px; }
  .rail-arrow:hover { border-color: var(--base); background: var(--base); }
  .rail-arrow:disabled { opacity: 0; pointer-events: none; }

  @media (max-width: 900px) {
    .cat-grid { grid-template-columns: repeat(2, 1fr); }
    .detail { grid-template-columns: 1fr; }
    .rail-track { grid-auto-columns: calc((100% - 2 * 16px) / 3); }
  }
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .filters { position: static; max-height: none; }
    /* Two columns of checkboxes, so the filters don't push the games far down. */
    .filters .group-options { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  }
  @media (max-width: 600px) {
    :root { --gutter: 16px; }
    .search { flex-basis: 100%; max-width: none; }
    .hero-title { font-size: 30px; }
    .page-title { font-size: 28px; }
    .cat-grid { grid-template-columns: 1fr; }
    .cat-card { min-height: 0; }
    /* On phones the rows are swiped; the next card peeks in to show there's more. */
    .rail-track { grid-auto-columns: 70%; }
    .rail-arrow { display: none; }
  }

  /* Tree test screens (index.html?test and ?results) keep the plain wireframe
     look: black on white, Arial, square boxes.                                */
  .tt-plain { background: #fff; max-width: 900px; margin: 0 auto; padding: 16px; }
  body.tt-plain { background-image: none; } /* no glow from the browsing pages */
  .tt-plain .container { padding: 0; }
  .tt-plain, .tt-plain *, .tt-modal, .tt-modal *, .tt-bar, .tt-bar * { font: 16px/1.4 Arial, sans-serif; color: #000; }
  .tt-plain button, .tt-modal button, .tt-bar button { background: #fff; border: 1px solid #000; border-radius: 0;
    padding: 8px 12px; cursor: pointer; text-align: left; }
  .tt-modal { margin: auto; border: 1px solid #000; padding: 24px; max-width: 520px; width: calc(100% - 32px); background: #fff; }
  .tt-modal::backdrop { background: #fff; }
  .tt-modal h2, .tt-modal p { margin-bottom: 12px; }
  .tt-form label { display: block; margin-bottom: 4px; }

/* ---------- Consoles ----------
   Where a game can be played today: platforms it's still sold on, plus the
   consoles that run those versions through backward compatibility (a PS4 game
   plays on a PS5). Platforms marked "No longer sold" don't count.            */
const CONSOLES = [
  { id: "pc",          label: "PC",                    short: "PC",          runs: ["Windows", "Mac", "Linux"] },
  { id: "ps5",         label: "PlayStation 5",         short: "PS5",         runs: ["PlayStation 5", "PlayStation 4"] },
  { id: "ps4",         label: "PlayStation 4",         short: "PS4",         runs: ["PlayStation 4"] },
  { id: "xbox-series", label: "Xbox Series X|S",       short: "Xbox Series", runs: ["Xbox Series X|S", "Xbox One"] },
  { id: "xbox-one",    label: "Xbox One",              short: "Xbox One",    runs: ["Xbox One"] },
  { id: "switch-2",    label: "Nintendo Switch 2",     short: "Switch 2",    runs: ["Nintendo Switch 2", "Nintendo Switch"] },
  { id: "switch",      label: "Nintendo Switch",       short: "Switch",      runs: ["Nintendo Switch"] },
  { id: "mobile",      label: "Mobile (iOS, Android)", short: "Mobile",      runs: ["iOS", "Android"] },
];
const forSale = price => /^\$|^Free/.test(price);
const priceValue = price => (price === "Free" ? 0 : parseFloat(price.slice(1)));
GAMES.forEach(g => {
  const sold = g.platforms.filter(([, price]) => forSale(price));
  g.consoles = CONSOLES.filter(c => sold.some(([name]) => c.runs.includes(name))).map(c => c.id);
  // Lowest and highest current price, for the cards and for sorting by price.
  const prices = sold.map(([, price]) => priceValue(price));
  g.price = prices.length ? Math.min(...prices) : null;
  g.maxPrice = prices.length ? Math.max(...prices) : null;
});

/* ---------- Two categorizations over the same blocks ----------
   Each view has one level of categories; everything else is a checkbox
   filter on the category's game list (OR within a group, AND across).
   Option ids are unique within each page's filters, since the URL keeps
   them in one list.                                                       */
const AUDIENCE = {
  label: "Audience",
  options: [
    { id: "family", label: "Family-Friendly", test: g => g.audience === "family" },
    { id: "mature", label: "Mature",          test: g => g.audience === "mature" },
  ],
};
const PLAYERS = {
  label: "Players",
  options: [
    { id: "single", label: "Singleplayer", test: g => g.players.includes("single") },
    { id: "multi",  label: "Multiplayer",  test: g => g.players.includes("multi") },
  ],
};
// Console comes first in every filter panel: it was the most-asked-for filter.
const CONSOLE = { label: "Console", options: CONSOLES.map(c => ({ ...c, test: g => g.consoles.includes(c.id) })) };
// hue tints the category's home-page card edge; picked by eye to match the category's
// cover art and to differ within each view.
const GENRES = [
  { id: "competitive", label: "Competitive Multiplayer", hue: 25 },
  { id: "racing",      label: "Racing",                  hue: 355 },
  { id: "action",      label: "Action & Adventure",      hue: 175 },
  { id: "build",       label: "Build & Strategize",      hue: 125 },
];
const GENRE = { label: "Genre", options: GENRES.map(c => ({ ...c, test: g => g.genre.includes(c.id) })) };
const PLAY_STYLES = [
  { id: "single", label: "Singleplayer",       short: "Solo",          hue: 210 },
  { id: "online", label: "Online Multiplayer", short: "Online",        hue: 25 },
  { id: "local",  label: "Couch & Local",      short: "Couch & local", hue: 330 },
];
// Game types group the store tags in game-details.js (129 different ones, half used
// by a single game) into kinds of game people filter by. A game can be several.
const hasTag = (g, ...tags) => tags.some(t => g.tags.includes(t));
const GAME_TYPE = {
  label: "Game Type",
  options: [
    { id: "shooter",    label: "Shooter",              test: g => hasTag(g, "FPS", "Third-Person Shooter", "Hero Shooter", "Arena Shooter", "Battle Royale") },
    { id: "fighting",   label: "Fighting",             test: g => hasTag(g, "Fighting") },
    { id: "moba",       label: "Battle Arena (MOBA)",  test: g => hasTag(g, "MOBA") },
    { id: "sports",     label: "Sports",               test: g => hasTag(g, "Sports") },
    { id: "party",      label: "Party",                test: g => hasTag(g, "Party") },
    { id: "arcade",     label: "Arcade & Kart Racing", test: g => hasTag(g, "Kart Racing", "Arcade") },
    { id: "sim-racing", label: "Racing Sim",           test: g => g.genre.includes("racing") && hasTag(g, "Simulation", "Realistic") },
    { id: "rpg",        label: "RPG",                  test: g => hasTag(g, "RPG", "Action RPG") },

    { id: "story",      label: "Story-Rich",           test: g => hasTag(g, "Story Rich") },
    { id: "strategy",   label: "Strategy",             test: g => hasTag(g, "Strategy", "Turn-Based Strategy", "Real-Time Strategy",

    { id: "builder",    label: "City & Base Building", test: g => hasTag(g, "City Builder", "Base Building", "Colony Sim", "Management", "Automation") },
    { id: "sandbox",    label: "Sandbox & Survival",   test: g => hasTag(g, "Sandbox", "Survival", "Crafting") },
    { id: "cozy",       label: "Cozy & Life Sim",      test: g => hasTag(g, "Life Sim", "Cozy", "Farming Sim", "Relaxing") },
  ],
};

// By the game's lowest current price on any platform (g.price).
const inRange = (g, min, max) => g.price != null && g.price >= min && g.price < max;
const PRICE = {
  label: "Price",
  options: [
    { id: "free",     label: "Free to play",   test: g => g.price === 0 },
    { id: "under-20", label: "Under $20",      test: g => inRange(g, 0.01, 20) },
    { id: "20-40",    label: "$20 to $40",     test: g => inRange(g, 20, 40) },
    { id: "40-plus",  label: "$40 and up",     test: g => inRange(g, 40, Infinity) },
  ],
};

const VIEWS = {
  genre: {
    label: "By Genre",
    categories: GENRES,
    inCategory: (g, c) => g.genre.includes(c),
    filters: [CONSOLE, GAME_TYPE, PRICE, PLAYERS, AUDIENCE],
  },
  play: {
    label: "By How You Play",
    categories: PLAY_STYLES,
    inCategory: (g, c) => g.play.includes(c),
    filters: [CONSOLE, GENRE, GAME_TYPE, PRICE, AUDIENCE],
  },
};

// Search results can be narrowed the same way, without going back to a category.
const SEARCH_FILTERS = [
  CONSOLE,
  GENRE,
  GAME_TYPE,
  PRICE,
  { label: "How You Play", options: PLAY_STYLES.map(c => ({ ...c, test: g => g.play.includes(c.id) })) },
  AUDIENCE,
];

const byId = (list, id) => list.find(x => x.id === id);

const applyFilters = (games, groups, active, key = x => x) => games.filter(x => groups.every(group => {
  const on = group.options.filter(o => active.has(o.id));
  return !on.length || on.some(o => o.test(key(x)));
}));

function gamesIn(view, cat, active) {
  const V = VIEWS[view];
  return applyFilters(GAMES.filter(g => V.inCategory(g, cat)), V.filters, active);
}

// Sort orders for game lists. The default ("") keeps the list's own order:
// the category's order, or best match first for search results. Games without
// a price or release date go last either way.
const byName = (a, b) => a.name.localeCompare(b.name);
const byDate = (a, b) => (!a.released - !b.released) || a.released.localeCompare(b.released);
const SORTS = [
  { id: "name",       label: "Name ↑",         hint: "A to Z",        compare: byName },
  { id: "name-desc",  label: "Name ↓",         hint: "Z to A",        compare: (a, b) => byName(b, a) },
  { id: "price-low",  label: "Price ↑",        hint: "Low to high",   compare: (a, b) => (a.price ?? Infinity) - (b.price ?? Infinity) || byName(a, b) },
  { id: "price-high", label: "Price ↓",        hint: "High to low",   compare: (a, b) => (b.price ?? -1) - (a.price ?? -1) || byName(a, b) },
  { id: "date-old",   label: "Release date ↑", hint: "Oldest first",  compare: (a, b) => byDate(a, b) || byName(a, b) },
  { id: "date-new",   label: "Release date ↓", hint: "Newest first",
    compare: (a, b) => (!a.released - !b.released) || b.released.localeCompare(a.released) || byName(a, b) },
];
function sortGames(list, sort, key = x => x) {
  const s = byId(SORTS, sort);
  return s ? [...list].sort((a, b) => s.compare(key(a), key(b))) : list;
}

/* ---------- Search ----------
   Keyword search over the same GAMES. A game is found by its name, a nickname,
   its store tags, the consoles it plays on, or the labels of its genre, players, play style and audience
   (taken from the structures above), plus the synonyms below for those labels. Words can be
   misspelled (edit distance) or unfinished (prefix), for suggestions as you type.
   Every word has to match; words that match no game at all are ignored.        */
const ATTRIBUTES = {
  genre:    GENRES,
  players:  PLAYERS.options,
  play:     PLAY_STYLES,
  audience: AUDIENCE.options,
};
const SYNONYMS = {
  genre: {
    // General words only: specific kinds of game (shooter, MOBA, souls-like,
    // sandbox...) are store tags in game-details.js, so they find just those games.
    competitive: "pvp versus vs esports ranked",
    racing:      "race races racer cars car driving drive motorsport speed track",
    action:      "adventure quest combat",
    build:       "building builder strategy strategic creative create",
  },
  players: {
    single: "singleplayer solo alone offline",
    multi:  "multiplayer coop cooperative friends together group party team",
  },
  play: {
    single: "singleplayer solo alone offline",
    online: "internet mmo matchmaking crossplay",
    local:  "couch splitscreen split screen sofa lan party",
  },
  audience: {
    family: "familyfriendly kids kid children child everyone wholesome casual cute",
    mature: "adult adults violent violence gore gory dark gritty",
  },
};
// Other words for consoles, by console id.
const CONSOLE_SYNONYMS = {
  "pc": "computer windows mac linux steam", "ps5": "ps5 ps playstation sony", "ps4": "ps4 ps playstation sony",
  "xbox-series": "xsx xss seriesx", "xbox-one": "xbone xb1", "switch-2": "switch2 ns2 nintendo",
  "switch": "ns nintendo", "mobile": "phone iphone ipad tablet",
};
// Other words for store tags.
const TAG_SYNONYMS = {
  "FPS": "shooter firstperson", "MOBA": "battle arena", "Cozy": "chill", "Life Sim": "simulation sim",
  "Kart Racing": "karts", "Souls-like": "soulslike", "Hack and Slash": "hackandslash",
};
// Nicknames people type instead of the full name, by game id.
const ALIASES = {
  "counter-strike-2": "cs cs2 csgo", "team-fortress-2": "tf2", "league-of-legends": "lol league",
  "super-smash-bros-ultimate": "smash ssbu", "forza-horizon-5": "fh5", "gran-turismo-7": "gt7",
  "mario-kart-8-deluxe": "mk8 mk8dx", "final-fantasy-vii-rebirth": "ff7 ffvii", "marvel-s-spider-man-2": "spidey",
  "the-legend-of-zelda-tears-of-the-kingdom": "totk", "baldur-s-gate-3": "bg3", "monster-hunter-wilds": "mhw",
  "god-of-war": "gow", "grand-theft-auto-v": "gta gta5 gtav", "super-mario-odyssey": "smo",
  "civilization-vii": "civ civ7", "animal-crossing": "acnh", "minecraft": "mc",
  "valorant": "val", "overwatch": "ow ow2", "call-of-duty-black-ops-7": "cod bo7 blackops", "battlefield-6": "bf bf6",
  "rocket-league": "rl", "street-fighter-6": "sf6", "ea-sports-fc-26": "fc fc26 fifa soccer", "mario-kart-world": "mkw",
  "need-for-speed-unbound": "nfs", "assetto-corsa-competizione": "acc", "crash-team-racing-nitro-fueled": "ctr",
  "hot-wheels-unleashed-2-turbocharged": "hw2", "red-dead-redemption-2": "rdr rdr2", "the-witcher-3-wild-hunt": "witcher tw3",
  "clair-obscur-expedition-33": "e33", "the-sims-4": "sims", "cities-skylines-ii": "skylines", "age-of-empires-iv": "aoe aoe4",
  "age-of-empires-ii-definitive-edition": "aoe aoe2", "total-war-warhammer-iii": "twwh3 warhammer", "crusader-kings-iii": "ck3",
};
Object.keys(ALIASES).forEach(id => { if (!byId(GAMES, id)) console.warn(`Search: no game with id "${id}"`); });
Object.keys(DETAILS).forEach(id => { if (!byId(GAMES, id)) console.warn(`game-details.js: no game with id "${id}"`); });

const STOPWORDS = new Set("a an the and or of to for in on with my me i im want looking some something game games play playing that where you like is it can".split(" "));
const ROMAN = { ii: "2", iii: "3", iv: "4", v: "5", vi: "6", vii: "7", viii: "8", ix: "9" };

// "Marvel's Spider-Man 2" -> "marvels spider-man 2"
const normalize = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/['’.]/g, "").replace(/&/g, " and ").replace(/[^a-z0-9-]+/g, " ").trim();
const split = s => s.split(/[\s-]+/).filter(Boolean).map(w => ROMAN[w] || w);
// Typed words join hyphens ("co-op" -> "coop"); indexed words are kept both ways.
const queryWords = s => split(normalize(s).replace(/-/g, ""));
const indexWords = s => [...new Set([...split(normalize(s)), ...split(normalize(s).replace(/-/g, ""))])];

// Optimal string alignment distance: insertions, deletions, substitutions, swaps.
function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
  }
  return d[a.length][b.length];
}

// How well a typed word matches an indexed word, from 0 (not at all) to 1 (exactly).
function wordMatch(q, w, minPrefix) {
  if (q === w) return 1;
  if (q.length >= minPrefix && w.startsWith(q)) return 0.8;
  // Typos are allowed after the first letter, which people rarely get wrong.
  const typos = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0;
  if (!typos || q[0] !== w[0]) return 0;
  if (Math.abs(q.length - w.length) <= typos && editDistance(q, w) <= typos) return 0.7;
  if (w.length > q.length && editDistance(q, w.slice(0, q.length)) <= typos) return 0.5;
  return 0;
}

// Per game: its name and nicknames (weighted higher), then one field per
// attribute value and one per store tag (from game-details.js).
const SEARCH_INDEX = GAMES.map(g => ({
  game: g,
  fields: [
    { words: [...indexWords(g.name), ...split(ALIASES[g.id] || "")], weight: 3, minPrefix: 2 },
    ...Object.entries(ATTRIBUTES).flatMap(([attr, options]) => [].concat(g[attr]).map(id => ({
      words: [...indexWords(byId(options, id).label), ...split(SYNONYMS[attr][id] || "")],
      weight: 1, minPrefix: 3, label: byId(options, id).label,
    }))),
    ...g.tags.map(tag => ({ words: [...indexWords(tag), ...split(TAG_SYNONYMS[tag] || "")], weight: 1, minPrefix: 3, label: tag })),
    ...g.consoles.map(id => byId(CONSOLES, id)).map(c => ({
      words: [...indexWords(c.label), ...split(CONSOLE_SYNONYMS[c.id] || "")], weight: 1, minPrefix: 3, label: c.label,
    })),
  ],
}));

// Returns { words, ignored, partial, results: [{ game, score, matched }] }, best first.
function search(query) {
  const words = [...new Set(queryWords(query).filter(w => !STOPWORDS.has(w)))];
  const scored = SEARCH_INDEX.map(({ game, fields }) => ({
    game,
    hits: words.map(q => {
      let best = { score: 0 };
      fields.forEach(f => f.words.forEach(w => {
        const score = wordMatch(q, w, f.minPrefix) * f.weight;
        if (score > best.score) best = { score, label: f.label };
      }));
      return best;
    }),
  }));
  const known = words.map((q, i) => scored.some(s => s.hits[i].score > 0));
  const ignored = words.filter((q, i) => !known[i]);
  const matches = s => s.hits.filter((h, i) => known[i] && h.score > 0).length;
  const needed = known.filter(Boolean).length;
  let found = needed ? scored.filter(s => matches(s) === needed) : [];
  const partial = needed > 1 && !found.length;
  if (partial) found = scored.filter(s => matches(s) > 0);
  const whole = normalize(query).replace(/-/g, "");
  const results = found.map(s => ({
    game: s.game,
    score: matches(s) * 10 + s.hits.reduce((sum, h) => sum + h.score, 0)
      + (whole && normalize(s.game.name).replace(/-/g, "").startsWith(whole) ? 2 : 0),
    matched: [...new Set(s.hits.filter(h => h.score > 0 && h.label).map(h => h.label))],
  })).sort((a, b) => b.score - a.score || a.game.name.localeCompare(b.game.name));
  return { words, ignored, partial, results };
}

/* ---------- Routing / rendering ----------
   #/                                 home: both views and their categories
   #/<view>/<cat>?f=a,b&s=sort        filterable, sortable game list for a category
   #/<view>/<cat>/<game>?f=a,b&s=sort leaf page (keeps filters and sort for Back)
   #/search?q=words&f=a,b&s=sort      search results, with the same filters and sort
   #/search/<game>?q=words&f=a,b      leaf page (keeps the query and filters for Back) */
function parseRoute() {
  const [path, query = ""] = location.hash.replace(/^#\/?/, "").split("?");
  const parts = path.split("/").filter(Boolean);
  const params = new URLSearchParams(query);
  const f = params.get("f");
  return { parts, view: VIEWS[parts[0]] ? parts[0] : null, active: new Set(f ? f.split(",") : []),
    q: params.get("q") || "", sort: params.get("s") || "" };
}

function routeTo(path, active, sort, q) {
  const params = [];
  if (q != null) params.push(`q=${encodeURIComponent(q)}`);
  if (active && active.size) params.push(`f=${[...active].join(",")}`);
  if (sort) params.push(`s=${sort}`);
  return `#/${path}` + (params.length ? `?${params.join("&")}` : "");
}

const searchRoute = (q, gameId, active, sort) => routeTo(`search${gameId ? "/" + gameId : ""}`, active, sort, q);

// The current page with other filters or another sort order.
function currentRouteWith(active, sort) {
  const { parts, q } = parseRoute();
  return routeTo(parts.join("/"), active, sort, parts[0] === "search" ? q : null);
}

const esc = s => s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const plural = n => `${n} ${n === 1 ? "game" : "games"}`;

// Page heading: a small label above, the title in the accent color, a line of detail below.
function pageHead(eyebrow, title, sub) {
  return `<div class="page-head">
    ${eyebrow ? `<p class="eyebrow">${esc(eyebrow)}</p>` : ""}
    <h1 class="page-title">${esc(title)}</h1>
    ${sub ? `<p class="page-sub">${sub}</p>` : ""}
  </div>`;
}

// Covers of four games spread through the category's list, so the art shows its range.
function categoryArt(games) {
  const withArt = games.filter(g => g.image);
  const picks = [0, 1, 2, 3].map(i => withArt[Math.floor((i * withArt.length) / 4)]).filter(Boolean);
  return `<span class="cat-art" aria-hidden="true">${picks.map(g =>
    `<img src="${esc(g.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`).join("")}</span>`;
}

function categoryCard(c, route, games) {
  return `<button class="card cat-card" data-log="${esc(c.label)}" data-route="${route}" data-type="category" style="--hue: ${c.hue}">
    ${categoryArt(games)}
    <span class="card-title">${esc(c.label)}</span>
    <span class="card-meta">${plural(games.length)}</span>
  </button>`;
}

// The game's initials sit under the cover image and show if it's missing or fails to load.
const initials = name => name.split(/[\s:-]+/).filter(w => /^[A-Za-z]/.test(w) && !/^(the|of)$/i.test(w))
  .slice(0, 2).map(w => w[0].toUpperCase()).join("");

function cover(game, cls, alt) {
  return `<span class="cover${cls ? " " + cls : ""}"><span aria-hidden="true">${initials(game.name)}</span>${game.image
    ? `<img src="${esc(game.image)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</span>`;
}

const tagList = labels => labels.map(t => `<span class="tag">${esc(t)}</span>`).join("");
// On game pages, each tag is a link that searches for it. The tree test hides the
// search box (tree-test.js), and then the tags stay plain, so they can't be used to search.
const tagLinks = labels => document.getElementById("search").hidden ? tagList(labels) : labels.map(t =>
  `<button class="tag tag-link" data-log="Tag: ${esc(t)}" data-route="${searchRoute(t)}" data-type="tag"
    title="Search for ${esc(t)}">${esc(t)}</button>`).join("");

const MONTHS = "January February March April May June July August September October November December".split(" ");
// "2023-06-02" -> "June 2, 2023"; "2026-09" -> "September 2026"
const formatDate = d => {
  const [y, m, day] = d.split("-").map(Number);
  return day ? `${MONTHS[m - 1]} ${day}, ${y}` : `${MONTHS[m - 1]} ${y}`;
};

// The kind of game, from its first store tag ("Fighting", "FPS", "Kart Racing"),
// so specific genres can be told apart inside a broad category.
const gameType = g => g.tags[0];
const genreLabels = g => g.genre.map(id => byId(GENRES, id).label);
const audienceLabel = g => byId(AUDIENCE.options, g.audience).label;
const consoleNames = (g, key) => g.consoles.map(id => byId(CONSOLES, id)[key]);
const playNames = (g, key) => g.play.map(id => byId(PLAY_STYLES, id)[key]);
const money = n => (n === 0 ? "Free" : `$${n.toFixed(2)}`);
const priceRange = g => g.price == null ? "Not sold now" : (g.maxPrice > g.price ? "From " : "") + money(g.price);

// Cards show the game type, genre and audience, then where it plays, how many can play, and the price.
const cardTags = g => (gameType(g) ? `<span class="tag type">${esc(gameType(g))}</span>` : "") +
  tagList(genreLabels(g).filter(l => l !== gameType(g)).concat(audienceLabel(g)));
// The game page shows every category the game is in.
const categoryLabels = g => [...new Set(Object.entries(ATTRIBUTES)
  .flatMap(([attr, options]) => [].concat(g[attr]).map(id => byId(options, id).label)))];

function gameCard(game, route, note) {
  const consoles = consoleNames(game, "short");
  return `<button class="card game-card" data-log="${esc(game.name)}" data-route="${route}" data-type="game">
    ${cover(game, "", "")}
    <span class="card-body">
      <span class="card-title">${esc(game.name)}</span>
      <span class="tags">${cardTags(game)}</span>
      <span class="card-facts">
        <span><b>Plays on</b> ${consoles.length ? esc(consoles.join(", ")) : "Not sold now"}</span>
        <span><b>Players</b> ${esc(playNames(game, "short").join(", "))}</span>
      </span>
      <span class="card-price">${priceRange(game)}</span>
      ${note ? `<span class="card-note">${note}</span>` : ""}
    </span>
  </button>`;
}

// Checkbox filters on the left of a game list, with a link to clear them. Each option
// shows how many games checking it would leave, given the other groups' filters
// (within a group, checking another option adds games). Options no game in the
// list has are left out; ones the other filters rule out are greyed.
// Each group's heading opens and closes it, so the user can fold away groups they
// don't need. All start open; closed ones stay closed while the panel redraws.
const closedGroups = new Set();
function filterPanel(groups, active, sort, all, key) {
  const fieldsets = groups.map(group => {
    const others = applyFilters(all, groups.filter(x => x !== group), active, key);
    const options = group.options.filter(o => active.has(o.id) || all.some(x => o.test(key(x))));
    if (!options.length) return "";
    const open = !closedGroups.has(group.label);
    const checked = options.filter(o => active.has(o.id)).length;
    return `<fieldset><legend><button type="button" class="group-toggle" data-group="${esc(group.label)}" aria-expanded="${open}">
      <span>${group.label}<span class="rule"> · any of</span>${checked ? `<span class="group-checked"> (${checked})</span>` : ""}</span>
      <span class="caret" aria-hidden="true">▾</span></button></legend>
    <div class="group-options"${open ? "" : " hidden"}>
    ${options.map(o => {
      const n = others.filter(x => o.test(key(x))).length;
      const off = !n && !active.has(o.id);
      return `<label${off ? ' class="none"' : ""}><input type="checkbox" data-log="Filter: ${esc(o.label)}" data-type="filter"
      data-filter="${o.id}"${active.has(o.id) ? " checked" : ""}${off ? " disabled" : ""}> ${esc(o.label)}<span class="count">${n}</span></label>`;
    }).join("")}
    </div>
    </fieldset>`;
  }).join("");
  const anyOn = groups.some(group => group.options.some(o => active.has(o.id)));
  return `<aside class="panel filters" aria-label="Filters">
    <div class="panel-head"><h2 class="panel-title">Filter</h2>${anyOn
      ? `<button class="clear" data-log="Clear filters" data-route="${currentRouteWith(new Set(), sort)}" data-type="clear-filters">Clear all</button>` : ""}</div>
    ${fieldsets}
  </aside>`;
}

// The sort menu above a list: a button that opens a list of sort orders. Each one
// carries data-log and data-route like a filter, and replaces the URL in place.
function sortMenu(sort, defaultLabel) {
  const current = byId(SORTS, sort) || { id: "", label: defaultLabel };
  const options = [{ id: "", label: defaultLabel, hint: "" }, ...SORTS].map(s => `<li>
      <button data-log="Sort: ${esc(s.label)}" data-route="${currentRouteWith(parseRoute().active, s.id)}" data-type="sort"
        ${s.id === current.id ? 'aria-current="true"' : ""}><span>${esc(s.label)}</span>${s.hint ? `<span class="hint">${s.hint}</span>` : ""}</button>
    </li>`).join("");
  return `<div class="sort-menu">
      <button class="sort-toggle" id="sort-toggle" aria-expanded="false" aria-controls="sort-list">
        <span>Sort<span class="sort-current">: ${esc(current.label)}</span></span><span class="caret" aria-hidden="true">▾</span>
      </button>
      <ul class="sort-list" id="sort-list" hidden>${options}</ul>
    </div>`;
}

// The checked filters in words above the list, spelling out how they combine:
// "Console: PC or PS5 and Price: Under $20". Each one has an × that unchecks it.
function appliedFilters(groups, active, sort) {
  const parts = groups.map(group => {
    const on = group.options.filter(o => active.has(o.id));
    if (!on.length) return "";
    return `<span class="applied-group"><span class="applied-label">${group.label}:</span> ${on.map(o => {
      const rest = new Set(active);
      rest.delete(o.id);
      return `<button class="chip" data-log="Remove filter: ${esc(o.label)}" data-route="${currentRouteWith(rest, sort)}"
        data-type="clear-filters" aria-label="Remove filter: ${esc(o.label)}">${esc(o.label)}<span aria-hidden="true">×</span></button>`;
    }).join(`<span class="joiner">or</span>`)}</span>`;
  }).filter(Boolean);
  return parts.length
    ? `<p class="applied"><span class="applied-label">Showing</span>${parts.join(`<span class="joiner">and</span>`)}</p>` : "";
}

// Filters on the left; what's applied, the sort menu and the games (or a note that none match) on the right.
// all is the list before filtering, for the counts; key gets the game from a list item.
function gameList(groups, active, sort, defaultSort, cards, all, key = x => x) {
  return `<div class="layout">
      ${filterPanel(groups, active, sort, all, key)}
      <div>
        <div class="list-head">${appliedFilters(groups, active, sort)}${sortMenu(sort, defaultSort)}</div>
        ${cards.length ? `<div class="game-grid">${cards.join("")}</div>`
          : `<div class="empty">No games match these filters. Try unchecking some, or clear them all.</div>`}
      </div>
    </div>`;
}

function backButton(label, route) {
  return `<button class="btn-secondary" data-log="${esc(label)}" data-route="${route}" data-type="back">← ${esc(label)}</button>`;
}

function gamePage(game, crumbs, eyebrow, back, related) {
  const platforms = game.platforms.map(([name, price, note]) => `<li>
      <span class="platform">${esc(name)}${note ? `<span class="platform-note">${esc(note)}</span>` : ""}</span>
      <span class="price${forSale(price) ? "" : " unavailable"}">${esc(price)}</span>
    </li>`).join("");
  const consoles = consoleNames(game, "label");
  const facts = [
    ["Type", game.tags.slice(0, 2).join(", ")],
    ["Genre", genreLabels(game).join(", ")],
    ["Players", playNames(game, "label").join(", ")],
    ["Plays on", consoles.length ? consoles.join(", ") : "Not sold on any platform now"],
    ["Audience", audienceLabel(game)],
    ["Price", priceRange(game)],
    ["Released", game.released && formatDate(game.released)],
  ].filter(([, value]) => value);
  return `${pageHead(eyebrow, game.name, `<span class="tags">${tagLinks(categoryLabels(game))}</span>`)}
    <div class="detail">
      <div class="detail-main">
        ${cover(game, "cover-large", `${game.name} cover art`)}
        <section class="panel about" aria-labelledby="about-title">
          <h2 class="panel-title" id="about-title">About this game</h2>
          <p class="description">${esc(game.description || "No description yet.")}</p>
          ${game.tags.length ? `<h3 class="sub-title">Tags</h3><div class="tags">${tagLinks(game.tags)}</div>` : ""}
          <p class="via">Found via ${crumbs.slice(1).map(c => esc(c[0])).join(" › ")}</p>
        </section>
      </div>
      <div class="detail-side">
        <section class="panel" aria-labelledby="glance-title">
          <h2 class="panel-title" id="glance-title">At a glance</h2>
          <dl class="facts">${facts.map(([term, value]) => `<dt>${term}</dt><dd>${esc(value)}</dd>`).join("")}</dl>
          <p class="fine-print">"Plays on" includes consoles that run it through backward compatibility:
            PS4 games play on PS5, Xbox One games on Xbox Series X|S, and Switch games on Switch 2.</p>
        </section>
        <section class="panel" aria-labelledby="platforms-title">
          <h2 class="panel-title" id="platforms-title">Platforms and prices</h2>
          ${platforms ? `<ul class="platforms">${platforms}</ul>` : `<p class="muted">No platform information yet.</p>`}
          <p class="fine-print">US list prices for the standard edition, checked ${PRICES_CHECKED}. Sale prices may be lower.</p>
        </section>
      </div>
    </div>
    ${back}
    ${related}`;
}

/* ---------- Related games under a game page ----------
   "More like this" ranks the other games by what they share with this one:
   kinds of game (Game Type) count most, then store tags, then genre, how you
   play and audience. The second row is the rest of the list the user came
   from: the category, with its filters and sort, or the search results.    */
const gameTypes = g => GAME_TYPE.options.filter(o => o.test(g)).map(o => o.id);
const shared = (a, b) => a.filter(x => b.includes(x)).length;
const similarity = (a, b) => 3 * shared(gameTypes(a), gameTypes(b)) + 2 * shared(a.tags, b.tags)
  + shared(a.genre, b.genre) + 0.5 * shared(a.play, b.play) + (a.audience === b.audience ? 0.5 : 0);

function moreLikeThis(game, count = 8) {
  return GAMES.filter(g => g !== game).map(g => ({ g, score: similarity(game, g) })).filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score || byName(a.g, b.g)).slice(0, count).map(x => x.g);
}

// The rest of a list after this game, wrapping around, so the row picks up where the user left off.
function restOf(list, game, skip, count = 12) {
  const i = list.indexOf(game);
  return [...list.slice(i + 1), ...list.slice(0, Math.max(i, 0))].filter(g => !skip.includes(g)).slice(0, count);
}

// A game that isn't in the list the user came from opens under its first genre.
const ownRoute = g => routeTo(`genre/${g.genre[0]}/${g.id}`);

// Small cards: cover, name, kind of game and price.
function miniCard(game, route) {
  return `<button class="card mini-card" data-log="${esc(game.name)}" data-route="${route}" data-type="game">
    ${cover(game, "", "")}
    <span class="mini-body">
      <span class="card-title">${esc(game.name)}</span>
      <span class="mini-foot">${gameType(game) ? `<span class="tag type">${esc(gameType(game))}</span>` : ""}
        <span class="card-price">${priceRange(game)}</span></span>
    </span>
  </button>`;
}

// A row of small cards that scrolls sideways, with arrows, and a "See all" link to the whole list.
function rail(id, title, sub, games, routeFor, seeAll) {
  if (!games.length) return "";
  return `<section class="related" aria-labelledby="${id}">
    <div class="related-head">
      <div><h2 class="section-title" id="${id}">${esc(title)}</h2>${sub ? `<p class="related-sub">${esc(sub)}</p>` : ""}</div>
      ${seeAll ? `<button class="btn-secondary" data-log="See all: ${esc(title)}" data-route="${seeAll}" data-type="see-all">See all</button>` : ""}
    </div>
    <div class="rail">
      <button class="rail-arrow prev" aria-label="Scroll ${esc(title)} left" disabled>‹</button>
      <div class="rail-track">${games.map(g => miniCard(g, routeFor(g))).join("")}</div>
      <button class="rail-arrow next" aria-label="Scroll ${esc(title)} right">›</button>
    </div>
  </section>`;
}

// "Filtered to PC, Under $20" when filters are checked.
const filteredTo = (groups, active) => {
  const labels = groups.flatMap(gr => gr.options).filter(o => active.has(o.id)).map(o => o.label);
  return labels.length ? `Filtered to ${labels.join(", ")}` : "";
};

function searchResults(q, active, sort) {
  const examples = `a game name, a genre (${GENRES.map(c => c.label).join(", ")}), a console (PS4, Switch, PC) or an audience (${AUDIENCE.options.map(o => o.label).join(", ")})`;
  if (!q.trim()) return pageHead("Search", "Search", `Search for ${esc(examples)}.`);
  const { ignored, partial, results } = search(q);
  if (!results.length) return `${pageHead("Search", `Results for "${q}"`, plural(0))}
    <div class="empty">No games match. Try ${esc(examples)}.</div>`;
  const shown = sortGames(applyFilters(results, SEARCH_FILTERS, active, r => r.game), sort, r => r.game);
  const count = shown.length === results.length ? plural(results.length) : `${shown.length} of ${plural(results.length)}`;
  return `${pageHead("Search", `Results for "${q}"`, count)}
    ${partial ? `<p class="notice">No game matches every word, so these match some of them.</p>` : ""}
    ${ignored.length ? `<p class="notice">Nothing matched: ${esc(ignored.join(", "))}</p>` : ""}
    ${gameList(SEARCH_FILTERS, active, sort, "Best match", shown.map(({ game, matched }) =>
      gameCard(game, searchRoute(q, game.id, active, sort), matched.length ? `Matched: ${esc(matched.join(", "))}` : "")),
      results, r => r.game)}`;
}

function render(keepScroll) {
  const { parts, view, active, q, sort } = parseRoute();
  const main = document.getElementById("main");
  const crumbs = [["Home", "#/"]];
  let html = "";
  let onGamePage = false;

  const [, catId, gameId] = parts;
  const cat = view && catId && byId(VIEWS[view].categories, catId);

  if (parts[0] === "search") {
    const resultsRoute = searchRoute(q, null, active, sort);
    const game = catId && byId(GAMES, catId);
    crumbs.push([`Search: "${q}"`, resultsRoute]);
    if (game) {
      crumbs.push([game.name, null]);
      const results = sortGames(applyFilters(search(q).results, SEARCH_FILTERS, active, r => r.game), sort, r => r.game)
        .map(r => r.game);
      const routeFor = g => results.includes(g) ? searchRoute(q, g.id, active, sort) : ownRoute(g);
      const like = moreLikeThis(game);
      onGamePage = true;
      html = gamePage(game, crumbs, "Search", backButton("Back to search results", resultsRoute),
        rail("like-title", "More like this", "", like, routeFor) +
        rail("more-title", `More results for "${q}"`, filteredTo(SEARCH_FILTERS, active), restOf(results, game, like),
          routeFor, resultsRoute));
    } else {
      html = searchResults(q, active, sort);
    }
  // Home (and any route without a valid category) shows both views as sections.
  } else if (!cat) {
    html = `<section class="hero">
        <h1 class="hero-title">Find a game to play</h1>
      </section>` + Object.entries(VIEWS).map(([id, V]) =>
      `<section class="browse" aria-labelledby="view-${id}">
        <h2 class="section-title" id="view-${id}">Browse ${esc(V.label.replace(/^By /, "by "))}</h2>
        <div class="cat-grid">${V.categories.map(c => categoryCard(c, routeTo(`${id}/${c.id}`),
          GAMES.filter(g => V.inCategory(g, c.id)))).join("")}</div>
      </section>`).join("");
  } else {
    const V = VIEWS[view];
    const listRoute = routeTo(`${view}/${cat.id}`, active, sort);
    const game = gameId && GAMES.find(g => g.id === gameId && V.inCategory(g, cat.id));
    // The view ("By Genre") isn't a page the user clicked through, so it shows above the title, not here.
    crumbs.push([cat.label, listRoute]);

    if (game) {
      crumbs.push([game.name, null]);
      const routeFor = g => V.inCategory(g, cat.id) ? routeTo(`${view}/${cat.id}/${g.id}`, active, sort) : ownRoute(g);
      const like = moreLikeThis(game);
      onGamePage = true;
      html = gamePage(game, crumbs, cat.label, backButton("Back to " + cat.label, listRoute),
        rail("like-title", "More like this", "", like, routeFor) +
        rail("more-title", `More ${cat.label} games`, filteredTo(V.filters, active),
          restOf(sortGames(gamesIn(view, cat.id, active), sort), game, like), routeFor, listRoute));
    } else {
      const list = sortGames(gamesIn(view, cat.id, active), sort);
      html = `${pageHead(V.label, cat.label, plural(list.length))}
        ${gameList(V.filters, active, sort, "Featured",
          list.map(g => gameCard(g, routeTo(`${view}/${cat.id}/${g.id}`, active, sort))),
          GAMES.filter(g => V.inCategory(g, cat.id)))}`;
    }
  }

  main.innerHTML = html;
  // The glow at the top marks the browsing pages: home, categories and search results.
  document.body.classList.toggle("browsing", !onGamePage);
  const sep = `<span class="sep" aria-hidden="true">›</span>`;
  // Breadcrumbs start once the user leaves the home page; "Home" alone says nothing.
  const crumbNav = document.getElementById("crumbs");
  crumbNav.classList.toggle("empty-crumbs", crumbs.length === 1);
  crumbNav.innerHTML = crumbs.length === 1 ? "" : crumbs
    .map(([label, route], i) => i === crumbs.length - 1
      ? `<span class="current" aria-current="page">${esc(label)}</span>`
      : (route
        ? `<button data-log="Breadcrumb: ${esc(label)}" data-route="${route}" data-type="breadcrumb">${esc(label)}</button>`
        : `<span>${esc(label)}</span>`) + sep)
    .join("");
  searchInput.value = parts[0] === "search" ? q : "";
  updateSearchButton();
  closeSuggestions();
  updateRails();
  // Only filter and sort changes pass true; a new page (hashchange passes its event) starts at the top.
  if (keepScroll !== true) window.scrollTo(0, 0);
}

/* Rows of related games: the arrows scroll a row by its width and hide at either end. */
function updateRails() {
  document.querySelectorAll(".rail").forEach(r => {
    const track = r.querySelector(".rail-track");
    r.querySelector(".prev").disabled = track.scrollLeft <= 1;
    r.querySelector(".next").disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 1;
  });
}
document.addEventListener("click", e => {
  const arrow = e.target.closest(".rail-arrow");
  if (!arrow) return;
  const track = arrow.parentElement.querySelector(".rail-track");
  track.scrollBy({ left: (arrow.classList.contains("next") ? 1 : -1) * track.clientWidth, behavior: "smooth" });
});
document.addEventListener("scroll", e => { if (e.target.classList && e.target.classList.contains("rail-track")) updateRails(); }, true);
window.addEventListener("resize", updateRails);

/* One listener handles every navigation or filter click. data-log is the
   label the tree test records (tree-test.js). Filter changes replace the
   current history entry so the browser Back button still goes to the
   previous page, not the previous filter state. */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-log]");
  if (!el) return;
  if (el.dataset.type === "filter") {
    const { active, sort } = parseRoute();
    el.checked ? active.add(el.dataset.filter) : active.delete(el.dataset.filter);
    history.replaceState(null, "", currentRouteWith(active, sort));
    render(true);
    return;
  }
  if (el.dataset.type === "clear-filters" || el.dataset.type === "sort") {
    history.replaceState(null, "", el.dataset.route);
    render(true);
    if (el.dataset.type === "sort") document.getElementById("sort-toggle").focus();
    return;
  }
  location.hash = el.dataset.route;
});

/* A filter group's heading opens or closes it in place, so the panel keeps its scroll position. */
document.addEventListener("click", e => {
  const toggle = e.target.closest(".group-toggle");
  if (!toggle) return;
  const open = toggle.getAttribute("aria-expanded") !== "true";
  open ? closedGroups.delete(toggle.dataset.group) : closedGroups.add(toggle.dataset.group);
  toggle.setAttribute("aria-expanded", open);
  toggle.closest("fieldset").querySelector(".group-options").hidden = !open;
});

/* Sort menu: the button opens and closes the list; clicking outside it or
   pressing Escape closes it, and the arrow keys move through the orders.  */
function setSortMenu(open) {
  const toggle = document.getElementById("sort-toggle");
  if (!toggle) return;
  toggle.setAttribute("aria-expanded", open);
  document.getElementById("sort-list").hidden = !open;
  if (open) (document.querySelector('.sort-list [aria-current]') || document.querySelector(".sort-list button")).focus();
}
document.addEventListener("click", e => {
  const toggle = e.target.closest("#sort-toggle");
  if (toggle) setSortMenu(toggle.getAttribute("aria-expanded") !== "true");
  else if (!e.target.closest(".sort-list")) setSortMenu(false);
});
document.addEventListener("keydown", e => {
  if (!e.target.closest(".sort-menu")) return;
  const items = [...document.querySelectorAll(".sort-list button")];
  const i = items.indexOf(e.target);
  if (e.key === "Escape") { setSortMenu(false); document.getElementById("sort-toggle").focus(); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (i === -1) return setSortMenu(true);
    items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
  }
});

/* Search box. The Search button and each suggestion carry data-log and
   data-route like every other control, so the click listener above opens
   them; pressing Enter in the box clicks the Search button.              */
const searchForm = document.getElementById("search");
const searchInput = document.getElementById("search-input");
const searchButton = document.getElementById("search-go");
const suggestionList = document.getElementById("search-list");
let activeSuggestion = -1;

function updateSearchButton() {
  const q = searchInput.value.trim();
  if (q) Object.assign(searchButton.dataset, { log: `Search: "${q}"`, route: searchRoute(q), type: "search" });
  else ["log", "route", "type"].forEach(k => delete searchButton.dataset[k]);
}

function setActiveSuggestion(i) {
  const options = suggestionList.querySelectorAll("li");
  activeSuggestion = i;
  options.forEach((li, n) => li.setAttribute("aria-selected", n === i));
  if (options[i]) searchInput.setAttribute("aria-activedescendant", options[i].id);
  else searchInput.removeAttribute("aria-activedescendant");
}

function closeSuggestions() {
  suggestionList.hidden = true;
  searchInput.setAttribute("aria-expanded", "false");
  setActiveSuggestion(-1);
}

function showSuggestions() {
  const q = searchInput.value.trim();
  if (!q) return closeSuggestions();
  const top = search(q).results.slice(0, 6);
  suggestionList.innerHTML = top.map(({ game }, i) =>
    `<li role="option" id="suggestion-${i}" data-log="Suggestion: ${esc(game.name)}" data-route="${searchRoute(q, game.id)}"
      data-type="suggestion">${esc(game.name)}</li>`).join("") +
    `<li role="option" id="suggestion-${top.length}" class="see-all" data-log="${esc(`Search: "${q}"`)}" data-route="${searchRoute(q)}"
      data-type="search">See all results for "${esc(q)}"</li>`;
  suggestionList.hidden = false;
  searchInput.setAttribute("aria-expanded", "true");
  setActiveSuggestion(-1);
}

searchInput.addEventListener("input", () => { updateSearchButton(); showSuggestions(); });
searchInput.addEventListener("keydown", e => {
  const count = suggestionList.querySelectorAll("li").length;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (suggestionList.hidden) showSuggestions();
    if (!count) return;
    setActiveSuggestion(e.key === "ArrowDown" ? (activeSuggestion + 1) % count
      : activeSuggestion <= 0 ? count - 1 : activeSuggestion - 1);
  } else if (e.key === "Enter" && !suggestionList.hidden && activeSuggestion >= 0) {
    e.preventDefault();
    suggestionList.querySelectorAll("li")[activeSuggestion].click();
  } else if (e.key === "Escape" && !suggestionList.hidden) {
    e.preventDefault();
    closeSuggestions();
  }
});
// Keep focus in the box while clicking a suggestion, and close the list on the way out.
suggestionList.addEventListener("mousedown", e => e.preventDefault());
searchForm.addEventListener("focusout", e => { if (!searchForm.contains(e.relatedTarget)) closeSuggestions(); });
searchForm.addEventListener("click", e => { if (e.target.closest("[data-log]")) closeSuggestions(); });
searchForm.addEventListener("submit", e => e.preventDefault());

window.addEventListener("hashchange", render);
render();
</script>
<script src="tree-test.js"></script>
</body>
</html>
