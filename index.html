<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Game Finder</title>
<style>
  /* Wireframe fidelity: black and white, one font, one size, generic boxes. */
  * { box-sizing: border-box; margin: 0; padding: 0; font: 16px/1.4 Arial, sans-serif; color: #000; }
  body { background: #fff; padding: 16px; max-width: 900px; margin: 0 auto; }
  button { background: #fff; border: 1px solid #000; padding: 8px 12px; cursor: pointer; text-align: left; }
  /* Only clickable controls get outlines; sections are separated by spacing. */
  .box { padding: 12px 0; margin-bottom: 12px; }
  header.box, footer.box { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .crumbs button { padding: 4px 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .grid button { min-height: 72px; width: 100%; }
  .placeholder { padding: 12px 0; margin-bottom: 12px; }
  .spacer { flex: 1; }
  textarea { width: 100%; height: 160px; border: 1px solid #000; padding: 8px; font-family: Arial, sans-serif; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
  .layout aside { margin: 0; }
  fieldset { border: none; padding: 0; margin-bottom: 12px; }
  fieldset label { display: block; padding: 4px 0; cursor: pointer; }
  @media (max-width: 600px) { .layout { grid-template-columns: 1fr; } }
  [hidden] { display: none !important; }

  /* Search box with suggestions under it */
  .search { position: relative; display: flex; gap: 8px; flex: 1 1 280px; max-width: 480px; margin-left: auto; }
  .search input { flex: 1; min-width: 0; border: 1px solid #000; padding: 8px; }
  .search ul { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; margin-top: 4px; list-style: none;
    border: 1px solid #000; background: #fff; }
  .search li { padding: 8px; cursor: pointer; }
  .search li:hover, .search li[aria-selected="true"] { outline: 2px solid #000; outline-offset: -2px; }

  /* Tree test (index.html?test and ?results) */
  .tt-modal { margin: auto; border: 1px solid #000; padding: 24px; max-width: 520px; width: calc(100% - 32px); background: #fff; }
  .tt-modal::backdrop { background: #fff; }
  .tt-modal h2, .tt-modal p { margin-bottom: 12px; }
  .tt-form label { display: block; margin-bottom: 4px; }
  .tt-form input { display: block; width: 100%; border: 1px solid #000; padding: 8px; margin-bottom: 12px; }
  .tt-primary { padding: 12px 24px; }
  .tt-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
    padding: 12px 16px; border-top: 1px solid #000; background: #fff; }
  .tt-task { flex: 1; }
  .tt-bar button { flex: none; }
  #main h1, #main h2 { margin: 16px 0 8px; }
  #main > p { margin-bottom: 12px; }
  .tt-scroll { overflow-x: auto; margin-bottom: 16px; }
  .tt-table { border-collapse: collapse; }
  .tt-table th, .tt-table td { border: 1px solid #000; padding: 6px 10px; text-align: left; vertical-align: top; }
  .tt-table tr.tt-summary td { border-top: 3px solid #000; }
  .tt-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tt-confirm { border: 1px solid #000; padding: 12px 16px; margin-bottom: 16px; }
  .tt-confirm p { margin-bottom: 8px; }
  .tt-confirm button + button { margin-left: 8px; }
  .tt-details { margin-bottom: 8px; }
  .tt-details summary { cursor: pointer; padding: 4px 0; }
  @media (max-width: 600px) { .tt-bar { flex-direction: column; align-items: stretch; gap: 8px; } }
</style>
</head>
<body>

<header class="box">
  <button data-log="Home" data-route="#/">Video Game Finder</button>
  <form class="search" id="search" role="search" autocomplete="off">
    <input id="search-input" type="search" placeholder="Search games, genres, audience" aria-label="Search games"
      role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-list">
    <button id="search-go" type="submit">Search</button>
    <ul id="search-list" role="listbox" aria-label="Suggestions" hidden></ul>
  </form>
</header>

<nav class="box crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

<main class="box" id="main"></main>

<footer class="box">
  <span>Click log: <span id="log-count">0</span> clicks</span>
  <span class="spacer"></span>
  <button id="dl-json">Download JSON</button>
  <button id="dl-csv">Download CSV</button>
  <button id="copy-json">Copy JSON</button>
  <button id="toggle-log">Show log</button>
  <button id="clear-log">Clear log</button>
</footer>
<section class="box" id="log-panel" hidden>
  <textarea id="log-text" readonly aria-label="Click log JSON"></textarea>
</section>

<script>
/* ---------- Information blocks (the 25 card-sort cards) ----------
   genre:    one of the four report categories
   players:  Singleplayer / Multiplayer (filter in the Genre view)
   play:     play situation (How You Play view categories)
   audience: Family-Friendly / Mature (filter in both views)                      */
const GAMES = [
  // Competitive Multiplayer
  { name: "Counter-Strike 2",            genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "mature" },
  { name: "Team Fortress 2",             genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "mature" },
  { name: "Fortnite",                    genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "family" },
  { name: "Halo Infinite",               genre: "competitive", players:  ["single", "multi"], play: ["single", "online"],         audience: "mature" },
  { name: "League of Legends",           genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "family" },
  { name: "Marvel Rivals",               genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "family" },
  { name: "Super Smash Bros. Ultimate",  genre: "competitive", players:  ["multi"],           play: ["local"],                    audience: "family" },
  // Racing
  { name: "Forza Horizon 5",             genre: "racing",      players:  ["single"],          play: ["single"],                   audience: "family" },
  { name: "Gran Turismo 7",              genre: "racing",      players:  ["single"],          play: ["single"],                   audience: "family" },
  { name: "Mario Kart 8 Deluxe",         genre: "racing",      players:  ["multi"],           play: ["local"],                    audience: "family" },
  // Action & Adventure
  { name: "Final Fantasy VII Rebirth",   genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  { name: "Marvel's Spider-Man 2",       genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  { name: "The Legend of Zelda: Tears of the Kingdom", genre: "action", players:  ["single"], play: ["single"],                   audience: "family" },
  { name: "Ratchet & Clank",             genre: "action",      players:  ["single"],          play: ["single"],                   audience: "family" },
  { name: "Baldur's Gate 3",             genre: "action",      players:  ["single", "multi"], play: ["single"],                   audience: "mature" },
  { name: "Hollow Knight: Silksong",     genre: "action",      players:  ["single"],          play: ["single"],                   audience: "family" },
  { name: "Elden Ring",                  genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  { name: "Monster Hunter Wilds",        genre: "action",      players:  ["single", "multi"], play: ["single", "online"],         audience: "mature" },
  { name: "God of War",                  genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  { name: "Grand Theft Auto V",          genre: "action",      players:  ["single", "multi"], play: ["single", "online"],         audience: "mature" },
  { name: "Super Mario Odyssey",         genre: "action",      players:  ["single", "multi"], play: ["single", "local"],          audience: "family" },
  { name: "Cyberpunk 2077",              genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  // Build & Strategize
  { name: "Minecraft",                   genre: "build",       players:  ["single", "multi"], play: ["single", "online"],         audience: "family" },
  { name: "Civilization VII",            genre: "build",       players:  ["single", "multi"], play: ["single", "online", "local"], audience: "family" },
  { name: "Animal Crossing",             genre: "build",       players:  ["single"],          play: ["single"],                   audience: "family" },
].map(g => ({ ...g, id: g.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") }));

/* ---------- Two categorizations over the same blocks ----------
   Each view has one level of categories; everything else is a checkbox
   filter on the category's game list (OR within a group, AND across).   */
const AUDIENCE = {
  label: "Audience",
  options: [
    { id: "family", label: "Family-Friendly", test: g => g.audience === "family" },
    { id: "mature", label: "Mature",          test: g => g.audience === "mature" },
  ],
};
const GENRES = [
  { id: "competitive", label: "Competitive Multiplayer" },
  { id: "racing",      label: "Racing" },
  { id: "action",      label: "Action & Adventure" },
  { id: "build",       label: "Build & Strategize" },
];

const VIEWS = {
  genre: {
    label: "By Genre",
    categories: GENRES,
    inCategory: (g, c) => g.genre === c,
    filters: [
      {
        label: "Players",
        options: [
          { id: "single", label: "Singleplayer", test: g => g.players.includes("single") },
          { id: "multi",  label: "Multiplayer",  test: g => g.players.includes("multi") },
        ],
      },
      AUDIENCE,
    ],
  },
  play: {
    label: "By How You Play",
    categories: [
      { id: "single", label: "Singleplayer" },
      { id: "online", label: "Online Multiplayer" },
      { id: "local",  label: "Couch & Local" },
    ],
    inCategory: (g, c) => g.play.includes(c),
    filters: [
      { label: "Genre", options: GENRES.map(c => ({ ...c, test: g => g.genre === c.id })) },
      AUDIENCE,
    ],
  },
};

const byId = (list, id) => list.find(x => x.id === id);

function gamesIn(view, cat, active) {
  const V = VIEWS[view];
  return GAMES.filter(g => V.inCategory(g, cat) && V.filters.every(group => {
    const on = group.options.filter(o => active.has(o.id));
    return !on.length || on.some(o => o.test(g));
  }));
}

/* ---------- Search ----------
   Keyword search over the same GAMES. A game is found by its name, a nickname,
   or the labels of its genre, players, play style and audience (taken from the
   structures above), plus the synonyms below for those labels. Words can be
   misspelled (edit distance) or unfinished (prefix), for suggestions as you type.
   Every word has to match; words that match no game at all are ignored.        */
const ATTRIBUTES = {
  genre:    GENRES,
  players:  VIEWS.genre.filters[0].options,
  play:     VIEWS.play.categories,
  audience: AUDIENCE.options,
};
const SYNONYMS = {
  genre: {
    competitive: "pvp versus vs esports shooter shooters fps moba arena battle royale fighting fighter ranked tactical team",
    racing:      "race races racer cars car driving drive kart karts motorsport speed track",
    action:      "adventure story rpg roleplaying openworld exploration explore quest fantasy hero superhero combat platformer soulslike boss bosses",
    build:       "building builder strategy strategic crafting craft sandbox simulation sim creative create empire turnbased turn city colony management cozy relaxing chill",
  },
  players: {
    single: "singleplayer solo alone offline",
    multi:  "multiplayer coop cooperative friends together group party team",
  },
  play: {
    single: "singleplayer solo alone offline",
    online: "internet mmo matchmaking crossplay",
    local:  "couch splitscreen split screen sofa lan party",
  },
  audience: {
    family: "familyfriendly kids kid children child everyone wholesome casual cute",
    mature: "adult adults violent violence gore gory dark gritty",
  },
};
// Nicknames people type instead of the full name, by game id.
const ALIASES = {
  "counter-strike-2": "cs cs2 csgo", "team-fortress-2": "tf2", "league-of-legends": "lol league",
  "super-smash-bros-ultimate": "smash ssbu", "forza-horizon-5": "fh5", "gran-turismo-7": "gt7",
  "mario-kart-8-deluxe": "mk8 mk8dx", "final-fantasy-vii-rebirth": "ff7 ffvii", "marvel-s-spider-man-2": "spidey",
  "the-legend-of-zelda-tears-of-the-kingdom": "totk", "baldur-s-gate-3": "bg3", "monster-hunter-wilds": "mhw",
  "god-of-war": "gow", "grand-theft-auto-v": "gta gta5 gtav", "super-mario-odyssey": "smo",
  "civilization-vii": "civ civ7", "animal-crossing": "acnh", "minecraft": "mc",
};
Object.keys(ALIASES).forEach(id => { if (!byId(GAMES, id)) console.warn(`Search: no game with id "${id}"`); });

const STOPWORDS = new Set("a an the and or of to for in on with my me i im want looking some something game games play playing that where you like is it can".split(" "));
const ROMAN = { ii: "2", iii: "3", iv: "4", v: "5", vi: "6", vii: "7", viii: "8", ix: "9" };

// "Marvel's Spider-Man 2" -> "marvels spider-man 2"
const normalize = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/['’.]/g, "").replace(/&/g, " and ").replace(/[^a-z0-9-]+/g, " ").trim();
const split = s => s.split(/[\s-]+/).filter(Boolean).map(w => ROMAN[w] || w);
// Typed words join hyphens ("co-op" -> "coop"); indexed words are kept both ways.
const queryWords = s => split(normalize(s).replace(/-/g, ""));
const indexWords = s => [...new Set([...split(normalize(s)), ...split(normalize(s).replace(/-/g, ""))])];

// Optimal string alignment distance: insertions, deletions, substitutions, swaps.
function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
  }
  return d[a.length][b.length];
}

// How well a typed word matches an indexed word, from 0 (not at all) to 1 (exactly).
function wordMatch(q, w, minPrefix) {
  if (q === w) return 1;
  if (q.length >= minPrefix && w.startsWith(q)) return 0.8;
  // Typos are allowed after the first letter, which people rarely get wrong.
  const typos = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0;
  if (!typos || q[0] !== w[0]) return 0;
  if (Math.abs(q.length - w.length) <= typos && editDistance(q, w) <= typos) return 0.7;
  if (w.length > q.length && editDistance(q, w.slice(0, q.length)) <= typos) return 0.5;
  return 0;
}

// Per game: its name and nicknames (weighted higher), then one field per attribute value.
const SEARCH_INDEX = GAMES.map(g => ({
  game: g,
  fields: [
    { words: [...indexWords(g.name), ...split(ALIASES[g.id] || "")], weight: 3, minPrefix: 2 },
    ...Object.entries(ATTRIBUTES).flatMap(([attr, options]) => [].concat(g[attr]).map(id => ({
      words: [...indexWords(byId(options, id).label), ...split(SYNONYMS[attr][id] || "")],
      weight: 1, minPrefix: 3, label: byId(options, id).label,
    }))),
  ],
}));

// Returns { words, ignored, partial, results: [{ game, score, matched }] }, best first.
function search(query) {
  const words = [...new Set(queryWords(query).filter(w => !STOPWORDS.has(w)))];
  const scored = SEARCH_INDEX.map(({ game, fields }) => ({
    game,
    hits: words.map(q => {
      let best = { score: 0 };
      fields.forEach(f => f.words.forEach(w => {
        const score = wordMatch(q, w, f.minPrefix) * f.weight;
        if (score > best.score) best = { score, label: f.label };
      }));
      return best;
    }),
  }));
  const known = words.map((q, i) => scored.some(s => s.hits[i].score > 0));
  const ignored = words.filter((q, i) => !known[i]);
  const matches = s => s.hits.filter((h, i) => known[i] && h.score > 0).length;
  const needed = known.filter(Boolean).length;
  let found = needed ? scored.filter(s => matches(s) === needed) : [];
  const partial = needed > 1 && !found.length;
  if (partial) found = scored.filter(s => matches(s) > 0);
  const whole = normalize(query).replace(/-/g, "");
  const results = found.map(s => ({
    game: s.game,
    score: matches(s) * 10 + s.hits.reduce((sum, h) => sum + h.score, 0)
      + (whole && normalize(s.game.name).replace(/-/g, "").startsWith(whole) ? 2 : 0),
    matched: [...new Set(s.hits.filter(h => h.score > 0 && h.label).map(h => h.label))],
  })).sort((a, b) => b.score - a.score || a.game.name.localeCompare(b.game.name));
  return { words, ignored, partial, results };
}

/* ---------- Click log ---------- */
const LOG_KEY = "steam-backlog-click-log";
const SESSION = Date.now().toString(36);
let log = [];
try { log = JSON.parse(localStorage.getItem(LOG_KEY)) || []; } catch (e) { log = []; }

function saveLog() {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch (e) {}
  document.getElementById("log-count").textContent = log.length;
  document.getElementById("log-text").value = JSON.stringify(log, null, 2);
}

function record(label, type, to) {
  const route = parseRoute();
  log.push({
    seq: log.length + 1,
    session: SESSION,
    time: new Date().toISOString(),
    label,
    type,
    from: location.hash || "#/",
    to,
    view: route.view || "",
    depth: route.parts.length,
  });
  saveLog();
}

function download(filename, text, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function toCSV(rows) {
  const cols = ["seq", "session", "time", "label", "type", "from", "to", "view", "depth"];
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  return [cols.join(","), ...rows.map(r => cols.map(c => esc(r[c])).join(","))].join("\n");
}

/* ---------- Routing / rendering ----------
   #/                            home: both views and their categories
   #/<view>/<cat>?f=a,b          filterable game list for a category
   #/<view>/<cat>/<game>?f=a,b   leaf placeholder page (keeps filters for Back)
   #/search?q=words              search results
   #/search/<game>?q=words       leaf placeholder page (keeps the query for Back) */
function parseRoute() {
  const [path, query = ""] = location.hash.replace(/^#\/?/, "").split("?");
  const parts = path.split("/").filter(Boolean);
  const params = new URLSearchParams(query);
  const f = params.get("f");
  return { parts, view: VIEWS[parts[0]] ? parts[0] : null, active: new Set(f ? f.split(",") : []), q: params.get("q") || "" };
}

function routeTo(path, active) {
  return `#/${path}` + (active && active.size ? `?f=${[...active].join(",")}` : "");
}

const searchRoute = (q, gameId) => `#/search${gameId ? "/" + gameId : ""}?q=${encodeURIComponent(q)}`;

const esc = s => s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function btn(label, route, type) {
  return `<button data-log="${esc(label)}" data-route="${route}" data-type="${type}">${esc(label)}</button>`;
}

function gamePage(game, crumbs, backButton) {
  return `<p>Game page: ${esc(game.name)}</p><br>
    <div class="placeholder">[ Placeholder page for: ${esc(game.name)} ]</div>
    <p>You reached this block via: ${crumbs.slice(1).map(c => esc(c[0])).join(" &gt; ")}</p><br>
    <div class="placeholder">[ Game details placeholder ]</div>
    ${backButton}`;
}

function searchResults(q) {
  const examples = `a game name, a genre (${GENRES.map(c => c.label).join(", ")}) or an audience (${AUDIENCE.options.map(o => o.label).join(", ")})`;
  if (!q.trim()) return `<p>Search for ${esc(examples)}.</p>`;
  const { ignored, partial, results } = search(q);
  return `<p>${results.length} ${results.length === 1 ? "game" : "games"} for "${esc(q)}"</p><br>
    ${partial ? `<p>No game matches every word, so these match some of them.</p><br>` : ""}
    ${ignored.length ? `<p>Nothing matched: ${esc(ignored.join(", "))}</p><br>` : ""}
    ${results.length
      ? `<div class="grid">${results.map(({ game, matched }) =>
          `<button data-log="${esc(game.name)}" data-route="${searchRoute(q, game.id)}" data-type="game">${esc(game.name)}${
            matched.length ? `<br><span>Matched: ${esc(matched.join(", "))}</span>` : ""}</button>`).join("")}</div>`
      : `<div class="placeholder">No games match. Try ${esc(examples)}.</div>`}`;
}

function render(keepScroll) {
  const { parts, view, active, q } = parseRoute();
  const main = document.getElementById("main");
  const crumbs = [["Home", "#/"]];
  let html = "";

  const [, catId, gameId] = parts;
  const cat = view && catId && byId(VIEWS[view].categories, catId);

  if (parts[0] === "search") {
    const resultsRoute = searchRoute(q);
    const game = catId && byId(GAMES, catId);
    crumbs.push([`Search: "${q}"`, resultsRoute]);
    if (game) {
      crumbs.push([game.name, null]);
      html = gamePage(game, crumbs, btn("Back to search results", resultsRoute, "back"));
    } else {
      html = searchResults(q);
    }
  // Home (and any route without a valid category) shows both views as sections.
  } else if (!cat) {
    html = `<p>Find a game in your backlog.</p><br>` + Object.entries(VIEWS).map(([id, V]) =>
      `<section class="box"><p>${V.label}</p><br>
        <div class="grid">${V.categories.map(c => btn(c.label, routeTo(`${id}/${c.id}`), "category")).join("")}</div>
      </section>`).join("");
  } else {
    const V = VIEWS[view];
    const listRoute = routeTo(`${view}/${cat.id}`, active);
    const game = gameId && GAMES.find(g => g.id === gameId && V.inCategory(g, cat.id));
    crumbs.push([V.label, null], [cat.label, listRoute]);

    if (game) {
      crumbs.push([game.name, null]);
      html = gamePage(game, crumbs, btn("Back to " + cat.label, listRoute, "back"));
    } else {
      const list = gamesIn(view, cat.id, active);
      const filters = V.filters.map(group => `<fieldset><legend>${group.label}</legend>
        ${group.options.map(o => `<label><input type="checkbox" data-log="Filter: ${esc(o.label)}" data-type="filter"
          data-filter="${o.id}"${active.has(o.id) ? " checked" : ""}> ${esc(o.label)}</label>`).join("")}
        </fieldset>`).join("");
      html = `<div class="layout">
        <aside class="box" aria-label="Filters"><p>Filter</p><br>${filters}</aside>
        <div><p>${esc(cat.label)}: ${list.length} games</p><br>
          ${list.length
            ? `<div class="grid">${list.map(g => btn(g.name, routeTo(`${view}/${cat.id}/${g.id}`, active), "game")).join("")}</div>`
            : `<div class="placeholder">No games match these filters.</div>`}
        </div></div>`;
    }
  }

  main.innerHTML = html;
  document.getElementById("crumbs").innerHTML = crumbs
    .map(([label, route], i) => i === crumbs.length - 1 || !route
      ? `<span>${esc(label)}</span>${i === crumbs.length - 1 ? "" : "<span>&gt;</span>"}`
      : `<button data-log="Breadcrumb: ${esc(label)}" data-route="${route}" data-type="breadcrumb">${esc(label)}</button><span>&gt;</span>`)
    .join("");
  searchInput.value = parts[0] === "search" ? q : "";
  updateSearchButton();
  closeSuggestions();
  if (!keepScroll) window.scrollTo(0, 0);
}

/* One listener records every navigation or filter click. Filter changes
   replace the current history entry so the browser Back button still
   goes to the previous page, not the previous filter state. */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-log]");
  if (!el) return;
  if (el.dataset.type === "filter") {
    const { parts, active } = parseRoute();
    el.checked ? active.add(el.dataset.filter) : active.delete(el.dataset.filter);
    const to = routeTo(parts.join("/"), active);
    record(`${el.dataset.log} (${el.checked ? "on" : "off"})`, "filter", to);
    history.replaceState(null, "", to);
    render(true);
    return;
  }
  record(el.dataset.log, el.dataset.type, el.dataset.route);
  location.hash = el.dataset.route;
});

document.getElementById("dl-json").onclick = () => download("click-log.json", JSON.stringify(log, null, 2), "application/json");
document.getElementById("dl-csv").onclick = () => download("click-log.csv", toCSV(log), "text/csv");
document.getElementById("copy-json").onclick = async e => {
  try { await navigator.clipboard.writeText(JSON.stringify(log, null, 2)); e.target.textContent = "Copied"; }
  catch (err) { document.getElementById("log-panel").hidden = false; document.getElementById("log-text").select(); e.target.textContent = "Select + copy below"; }
  setTimeout(() => (e.target.textContent = "Copy JSON"), 1500);
};
document.getElementById("toggle-log").onclick = e => {
  const panel = document.getElementById("log-panel");
  panel.hidden = !panel.hidden;
  e.target.textContent = panel.hidden ? "Show log" : "Hide log";
};
document.getElementById("clear-log").onclick = () => {
  if (confirm("Clear the click log?")) { log = []; saveLog(); }
};

/* Search box. The Search button and each suggestion carry data-log and
   data-route like every other control, so the click listener above logs and
   opens them; pressing Enter in the box clicks the Search button. Typing
   itself isn't logged.                                                     */
const searchForm = document.getElementById("search");
const searchInput = document.getElementById("search-input");
const searchButton = document.getElementById("search-go");
const suggestionList = document.getElementById("search-list");
let activeSuggestion = -1;

function updateSearchButton() {
  const q = searchInput.value.trim();
  if (q) Object.assign(searchButton.dataset, { log: `Search: "${q}"`, route: searchRoute(q), type: "search" });
  else ["log", "route", "type"].forEach(k => delete searchButton.dataset[k]);
}

function setActiveSuggestion(i) {
  const options = suggestionList.querySelectorAll("li");
  activeSuggestion = i;
  options.forEach((li, n) => li.setAttribute("aria-selected", n === i));
  if (options[i]) searchInput.setAttribute("aria-activedescendant", options[i].id);
  else searchInput.removeAttribute("aria-activedescendant");
}

function closeSuggestions() {
  suggestionList.hidden = true;
  searchInput.setAttribute("aria-expanded", "false");
  setActiveSuggestion(-1);
}

function showSuggestions() {
  const q = searchInput.value.trim();
  if (!q) return closeSuggestions();
  const top = search(q).results.slice(0, 6);
  suggestionList.innerHTML = top.map(({ game }, i) =>
    `<li role="option" id="suggestion-${i}" data-log="Suggestion: ${esc(game.name)}" data-route="${searchRoute(q, game.id)}"
      data-type="suggestion">${esc(game.name)}</li>`).join("") +
    `<li role="option" id="suggestion-${top.length}" data-log="${esc(`Search: "${q}"`)}" data-route="${searchRoute(q)}"
      data-type="search">See all results for "${esc(q)}"</li>`;
  suggestionList.hidden = false;
  searchInput.setAttribute("aria-expanded", "true");
  setActiveSuggestion(-1);
}

searchInput.addEventListener("input", () => { updateSearchButton(); showSuggestions(); });
searchInput.addEventListener("keydown", e => {
  const count = suggestionList.querySelectorAll("li").length;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (suggestionList.hidden) showSuggestions();
    if (!count) return;
    setActiveSuggestion(e.key === "ArrowDown" ? (activeSuggestion + 1) % count
      : activeSuggestion <= 0 ? count - 1 : activeSuggestion - 1);
  } else if (e.key === "Enter" && !suggestionList.hidden && activeSuggestion >= 0) {
    e.preventDefault();
    suggestionList.querySelectorAll("li")[activeSuggestion].click();
  } else if (e.key === "Escape" && !suggestionList.hidden) {
    e.preventDefault();
    closeSuggestions();
  }
});
// Keep focus in the box while clicking a suggestion, and close the list on the way out.
suggestionList.addEventListener("mousedown", e => e.preventDefault());
searchForm.addEventListener("focusout", e => { if (!searchForm.contains(e.relatedTarget)) closeSuggestions(); });
searchForm.addEventListener("click", e => { if (e.target.closest("[data-log]")) closeSuggestions(); });
searchForm.addEventListener("submit", e => e.preventDefault());

window.addEventListener("hashchange", render);
saveLog();
render();
</script>
<script src="tree-test.js"></script>
</body>
