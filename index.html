<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Game Finder</title>
<style>
  /* Wireframe fidelity: black and white, one font, one size, generic boxes. */
  * { box-sizing: border-box; margin: 0; padding: 0; font: 16px/1.4 Arial, sans-serif; color: #000; }
  body { background: #fff; padding: 16px; max-width: 900px; margin: 0 auto; }
  button { background: #fff; border: 1px solid #000; padding: 8px 12px; cursor: pointer; text-align: left; }
  /* Only clickable controls get outlines; sections are separated by spacing. */
  .box { padding: 12px 0; margin-bottom: 12px; }
  header.box, footer.box { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .crumbs button { padding: 4px 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .grid button { min-height: 72px; width: 100%; }
  .placeholder { padding: 12px 0; margin-bottom: 12px; }
  .spacer { flex: 1; }
  textarea { width: 100%; height: 160px; border: 1px solid #000; padding: 8px; font-family: Arial, sans-serif; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
  .layout aside { margin: 0; }
  fieldset { border: none; padding: 0; margin-bottom: 12px; }
  fieldset label { display: block; padding: 4px 0; cursor: pointer; }
  @media (max-width: 600px) { .layout { grid-template-columns: 1fr; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="box">
  <button data-log="Home" data-route="#/">Video Game Finder</button>
</header>

<nav class="box crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

<main class="box" id="main"></main>

<footer class="box">
  <span>Click log: <span id="log-count">0</span> clicks</span>
  <span class="spacer"></span>
  <button id="dl-json">Download JSON</button>
  <button id="dl-csv">Download CSV</button>
  <button id="copy-json">Copy JSON</button>
  <button id="toggle-log">Show log</button>
  <button id="clear-log">Clear log</button>
</footer>
<section class="box" id="log-panel" hidden>
  <textarea id="log-text" readonly aria-label="Click log JSON"></textarea>
</section>

<script>
/* ---------- Information blocks (the 25 card-sort cards) ----------
   genre:    one of the four report categories
   players:  Singleplayer / Multiplayer (filter in the Genre view)
   play:     play situation (How You Play view categories)
   audience: Family-Friendly / Mature (filter in both views)                      */
const GAMES = [
  // Competitive Multiplayer
  { name: "Counter-Strike 2",            genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "mature" },
  { name: "Team Fortress 2",             genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "mature" },
  { name: "Fortnite",                    genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "family" },
  { name: "Halo Infinite",               genre: "competitive", players:  ["single", "multi"], play: ["single", "online"],         audience: "mature" },
  { name: "League of Legends",           genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "family" },
  { name: "Marvel Rivals",               genre: "competitive", players:  ["multi"],           play: ["online"],                   audience: "family" },
  { name: "Super Smash Bros. Ultimate",  genre: "competitive", players:  ["multi"],           play: ["local"],                    audience: "family" },
  // Racing
  { name: "Forza Horizon 5",             genre: "racing",      players:  ["single"],          play: ["single"],                   audience: "family" },
  { name: "Gran Turismo 7",              genre: "racing",      players:  ["single"],          play: ["single"],                   audience: "family" },
  { name: "Mario Kart 8 Deluxe",         genre: "racing",      players:  ["multi"],           play: ["local"],                    audience: "family" },
  // Action & Adventure
  { name: "Final Fantasy VII Rebirth",   genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  { name: "Marvel's Spider-Man 2",       genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  { name: "The Legend of Zelda: Tears of the Kingdom", genre: "action", players:  ["single"], play: ["single"],                   audience: "family" },
  { name: "Ratchet & Clank",             genre: "action",      players:  ["single"],          play: ["single"],                   audience: "family" },
  { name: "Baldur's Gate 3",             genre: "action",      players:  ["single", "multi"], play: ["single"],                   audience: "mature" },
  { name: "Hollow Knight: Silksong",     genre: "action",      players:  ["single"],          play: ["single"],                   audience: "family" },
  { name: "Elden Ring",                  genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  { name: "Monster Hunter Wilds",        genre: "action",      players:  ["single", "multi"], play: ["single", "online"],         audience: "mature" },
  { name: "God of War",                  genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  { name: "Grand Theft Auto V",          genre: "action",      players:  ["single", "multi"], play: ["single", "online"],         audience: "mature" },
  { name: "Super Mario Odyssey",         genre: "action",      players:  ["single", "multi"], play: ["single", "local"],          audience: "family" },
  { name: "Cyberpunk 2077",              genre: "action",      players:  ["single"],          play: ["single"],                   audience: "mature" },
  // Build & Strategize
  { name: "Minecraft",                   genre: "build",       players:  ["single", "multi"], play: ["single", "online"],         audience: "family" },
  { name: "Civilization VII",            genre: "build",       players:  ["single", "multi"], play: ["single", "online", "local"], audience: "family" },
  { name: "Animal Crossing",             genre: "build",       players:  ["single"],          play: ["single"],                   audience: "family" },
].map(g => ({ ...g, id: g.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") }));

/* ---------- Two categorizations over the same blocks ----------
   Each view has one level of categories; everything else is a checkbox
   filter on the category's game list (OR within a group, AND across).   */
const AUDIENCE = {
  label: "Audience",
  options: [
    { id: "family", label: "Family-Friendly", test: g => g.audience === "family" },
    { id: "mature", label: "Mature",          test: g => g.audience === "mature" },
  ],
};
const GENRES = [
  { id: "competitive", label: "Competitive Multiplayer" },
  { id: "racing",      label: "Racing" },
  { id: "action",      label: "Action & Adventure" },
  { id: "build",       label: "Build & Strategize" },
];

const VIEWS = {
  genre: {
    label: "By Genre",
    categories: GENRES,
    inCategory: (g, c) => g.genre === c,
    filters: [
      {
        label: "Players",
        options: [
          { id: "single", label: "Singleplayer", test: g => g.players.includes("single") },
          { id: "multi",  label: "Multiplayer",  test: g => g.players.includes("multi") },
        ],
      },
      AUDIENCE,
    ],
  },
  play: {
    label: "By How You Play",
    categories: [
      { id: "single", label: "Singleplayer" },
      { id: "online", label: "Online Multiplayer" },
      { id: "local",  label: "Couch & Local" },
    ],
    inCategory: (g, c) => g.play.includes(c),
    filters: [
      { label: "Genre", options: GENRES.map(c => ({ ...c, test: g => g.genre === c.id })) },
      AUDIENCE,
    ],
  },
};

const byId = (list, id) => list.find(x => x.id === id);

function gamesIn(view, cat, active) {
  const V = VIEWS[view];
  return GAMES.filter(g => V.inCategory(g, cat) && V.filters.every(group => {
    const on = group.options.filter(o => active.has(o.id));
    return !on.length || on.some(o => o.test(g));
  }));
}

/* ---------- Click log ---------- */
const LOG_KEY = "steam-backlog-click-log";
const SESSION = Date.now().toString(36);
let log = [];
try { log = JSON.parse(localStorage.getItem(LOG_KEY)) || []; } catch (e) { log = []; }

function saveLog() {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch (e) {}
  document.getElementById("log-count").textContent = log.length;
  document.getElementById("log-text").value = JSON.stringify(log, null, 2);
}

function record(label, type, to) {
  const route = parseRoute();
  log.push({
    seq: log.length + 1,
    session: SESSION,
    time: new Date().toISOString(),
    label,
    type,
    from: location.hash || "#/",
    to,
    view: route.view || "",
    depth: route.parts.length,
  });
  saveLog();
}

function download(filename, text, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function toCSV(rows) {
  const cols = ["seq", "session", "time", "label", "type", "from", "to", "view", "depth"];
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  return [cols.join(","), ...rows.map(r => cols.map(c => esc(r[c])).join(","))].join("\n");
}

/* ---------- Routing / rendering ----------
   #/                            home: both views and their categories
   #/<view>/<cat>?f=a,b          filterable game list for a category
   #/<view>/<cat>/<game>?f=a,b   leaf placeholder page (keeps filters for Back) */
function parseRoute() {
  const [path, query = ""] = location.hash.replace(/^#\/?/, "").split("?");
  const parts = path.split("/").filter(Boolean);
  const f = new URLSearchParams(query).get("f");
  return { parts, view: VIEWS[parts[0]] ? parts[0] : null, active: new Set(f ? f.split(",") : []) };
}

function routeTo(path, active) {
  return `#/${path}` + (active && active.size ? `?f=${[...active].join(",")}` : "");
}

const esc = s => s.replace(/&/g, "&amp;").replace(/"/g, "&quot;");

function btn(label, route, type) {
  return `<button data-log="${esc(label)}" data-route="${route}" data-type="${type}">${esc(label)}</button>`;
}

function render(keepScroll) {
  const { parts, view, active } = parseRoute();
  const main = document.getElementById("main");
  const crumbs = [["Home", "#/"]];
  let html = "";

  const [, catId, gameId] = parts;
  const cat = view && catId && byId(VIEWS[view].categories, catId);

  // Home (and any route without a valid category) shows both views as sections.
  if (!cat) {
    html = `<p>Find a game in your backlog.</p><br>` + Object.entries(VIEWS).map(([id, V]) =>
      `<section class="box"><p>${V.label}</p><br>
        <div class="grid">${V.categories.map(c => btn(c.label, routeTo(`${id}/${c.id}`), "category")).join("")}</div>
      </section>`).join("");
  } else {
    const V = VIEWS[view];
    const listRoute = routeTo(`${view}/${cat.id}`, active);
    const game = gameId && GAMES.find(g => g.id === gameId && V.inCategory(g, cat.id));
    crumbs.push([V.label, null], [cat.label, listRoute]);

    if (game) {
      crumbs.push([game.name, null]);
      html = `<p>Game page: ${esc(game.name)}</p><br>
        <div class="placeholder">[ Placeholder page for: ${esc(game.name)} ]</div>
        <p>You reached this block via: ${crumbs.slice(1).map(c => esc(c[0])).join(" &gt; ")}</p><br>
        <div class="placeholder">[ Game details placeholder ]</div>
        ${btn("Back to " + cat.label, listRoute, "back")}`;
    } else {
      const list = gamesIn(view, cat.id, active);
      const filters = V.filters.map(group => `<fieldset><legend>${group.label}</legend>
        ${group.options.map(o => `<label><input type="checkbox" data-log="Filter: ${esc(o.label)}" data-type="filter"
          data-filter="${o.id}"${active.has(o.id) ? " checked" : ""}> ${esc(o.label)}</label>`).join("")}
        </fieldset>`).join("");
      html = `<div class="layout">
        <aside class="box" aria-label="Filters"><p>Filter</p><br>${filters}</aside>
        <div><p>${esc(cat.label)}: ${list.length} games</p><br>
          ${list.length
            ? `<div class="grid">${list.map(g => btn(g.name, routeTo(`${view}/${cat.id}/${g.id}`, active), "game")).join("")}</div>`
            : `<div class="placeholder">No games match these filters.</div>`}
        </div></div>`;
    }
  }

  main.innerHTML = html;
  document.getElementById("crumbs").innerHTML = crumbs
    .map(([label, route], i) => i === crumbs.length - 1 || !route
      ? `<span>${esc(label)}</span>${i === crumbs.length - 1 ? "" : "<span>&gt;</span>"}`
      : `<button data-log="Breadcrumb: ${esc(label)}" data-route="${route}" data-type="breadcrumb">${esc(label)}</button><span>&gt;</span>`)
    .join("");
  if (!keepScroll) window.scrollTo(0, 0);
}

/* One listener records every navigation or filter click. Filter changes
   replace the current history entry so the browser Back button still
   goes to the previous page, not the previous filter state. */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-log]");
  if (!el) return;
  if (el.dataset.type === "filter") {
    const { parts, active } = parseRoute();
    el.checked ? active.add(el.dataset.filter) : active.delete(el.dataset.filter);
    const to = routeTo(parts.join("/"), active);
    record(`${el.dataset.log} (${el.checked ? "on" : "off"})`, "filter", to);
    history.replaceState(null, "", to);
    render(true);
    return;
  }
  record(el.dataset.log, el.dataset.type, el.dataset.route);
  location.hash = el.dataset.route;
});

document.getElementById("dl-json").onclick = () => download("click-log.json", JSON.stringify(log, null, 2), "application/json");
document.getElementById("dl-csv").onclick = () => download("click-log.csv", toCSV(log), "text/csv");
document.getElementById("copy-json").onclick = async e => {
  try { await navigator.clipboard.writeText(JSON.stringify(log, null, 2)); e.target.textContent = "Copied"; }
  catch (err) { document.getElementById("log-panel").hidden = false; document.getElementById("log-text").select(); e.target.textContent = "Select + copy below"; }
  setTimeout(() => (e.target.textContent = "Copy JSON"), 1500);
};
document.getElementById("toggle-log").onclick = e => {
  const panel = document.getElementById("log-panel");
  panel.hidden = !panel.hidden;
  e.target.textContent = panel.hidden ? "Show log" : "Hide log";
};
document.getElementById("clear-log").onclick = () => {
  if (confirm("Clear the click log?")) { log = []; saveLog(); }
};

window.addEventListener("hashchange", render);
saveLog();
render();
</script>
</body>
</html>
